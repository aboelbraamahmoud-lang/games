*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#cbf2ec,transparent 50%),#edf5ff;color:#142c49;font:18px Tahoma,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:clamp(12px,4vw,48px)}main{width:min(100%,1000px);background:#fff;border:1px solid #d4e6ec;border-radius:30px;overflow:hidden;box-shadow:0 20px 65px #24496b20}header{background:linear-gradient(115deg,#132e50,#125c66);color:#fff;padding:24px clamp(16px,5vw,48px)}header p{margin:0 0 9px;color:#d6fff4;font-size:clamp(14px,2.4vw,19px)}h1{margin:12px 0;font-size:clamp(29px,5.5vw,55px)}.meta{display:flex;flex-wrap:wrap;gap:8px 20px;color:#e1f6ff;font-size:16px}.body{padding:clamp(14px,4vw,38px)}.top,footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}.top p{margin:0}.count{background:#e4f6f0;color:#075a4c;border-radius:99px;padding:7px 14px;font-weight:bold} .sentence{padding:clamp(12px,3vw,24px);border-radius:20px;background:#f3f8fe;margin:18px 0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;font-size:clamp(19px,3.8vw,34px);font-weight:bold;line-height:1.55}.phrase{white-space:nowrap}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #ca7412;outline-offset:3px}.slot{border:2px dashed #47838e;background:#eaf7fa;border-radius:12px;color:#205461;min-width:120px;min-height:52px;padding:4px 10px;font-weight:bold}.slot.hover{background:#c6efe9;outline:3px solid #16796d}.slot.filled{border:2px solid #398773;background:#dff6eb;color:#075a4c;opacity:1;cursor:default}.slot.wrong{animation:shake .25s;background:#ffe2db;border-color:#a93421}@keyframes shake{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;min-height:70px}.tile{border:1px solid #a6ced6;border-bottom:4px solid #8cbcc7;background:#ecfbfd;border-radius:13px;padding:9px 15px;font-size:clamp(17px,2.75vw,24px);font-weight:bold;touch-action:none;user-select:none;cursor:grab}.tile.selected{background:#fff0cc;border-color:#ad690c}.ghost{position:fixed;z-index:10;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap;box-shadow:0 6px 25px #172a5540}.status{min-height:28px;margin:10px 0;color:#34536e;font-weight:bold}.status.win{padding:10px 14px;border-radius:13px;color:#084c3c;background:#ddf7e9}.action{padding:8px 14px;border-radius:10px;border:1px solid #afc4d7;background:#fff}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

const digits=new Intl.NumberFormat('ar-QA',{numberingSystem:'arab'});
let filled=new Set(), selected=null, drag=null, audio, muted=false, animation;
function message(text,win=false){status.textContent=text;status.classList.toggle('win',win);}
function update(){
 count.textContent=digits.format(filled.size)+' من '+digits.format(words.length);
 document.querySelector('#meter-fill').style.width=100*filled.size/words.length+'%';
 const coach=document.querySelector('#coach');
 const won=filled.size===words.length;
 coach.textContent=won?'أَحْسَنْتَ يَا بَطَلْ!':'هَيَّا نُكْمِلُ التَّعْرِيفْ!';
 coach.classList.toggle('success',won);
}
function play(notes){
 if(muted)return;
 try{
  audio ??= new AudioContext();
  audio.resume().catch(()=>{});
  const now=audio.currentTime;
  notes.forEach(([pitch,offset,length])=>{
   const tone=audio.createOscillator(), volume=audio.createGain(), at=now+offset;
   tone.type='sine';tone.frequency.value=pitch;
   volume.gain.setValueAtTime(.001,at);volume.gain.exponentialRampToValueAtTime(.11,at+.025);
   volume.gain.exponentialRampToValueAtTime(.001,at+length);
   tone.connect(volume).connect(audio.destination);tone.start(at);tone.stop(at+length);
  });
 }catch{}
}
function select(id){
 selected=id;
 for(const tile of bank.children){
  tile.classList.toggle('selected',Number(tile.dataset.word)===id);
  tile.setAttribute('aria-pressed',String(Number(tile.dataset.word)===id));
 }
}
function place(slot){
 if(selected===null){message('اختر بطاقة أولًا.');return;}
 const id=Number(slot.dataset.slot);
 if(filled.has(id))return;
 if(selected!==id){
  slot.classList.remove('wrong');void slot.offsetWidth;slot.classList.add('wrong');
  message('جرّب وضع البطاقة في فراغ آخر.');play([[280,0,.17],[220,.12,.2]]);return;
 }
 const moveFocus=document.activeElement===slot||bank.contains(document.activeElement);
 filled.add(id);slot.textContent=words[id];slot.classList.add('filled');slot.disabled=true;
 slot.setAttribute('aria-label',words[id]);
 bank.querySelector('[data-word="'+id+'"]').remove();
 select(null);update();
 if(filled.size===words.length){
  message('أحسنت! أكملت تعريف الوضوء بنجاح.',true);
  play([[523,0,.32],[659,.12,.32],[784,.24,.42],[1047,.40,.7],[1319,.56,.55]]);
  celebrate();
 }else{message('إجابة صحيحة! أكمل الفراغات الباقية.');play([[620,0,.17],[880,.09,.22]]);}
 if(moveFocus)(bank.firstElementChild||document.querySelector('#reset')).focus();
}
function stopDrag(){
 drag?.ghost?.remove();drag?.slot?.classList.remove('hover');drag=null;
}
function startDrag(event){
 if(event.button!==0||drag)return;
 const tile=event.currentTarget;
 drag={tile,pointer:event.pointerId,x:event.clientX,y:event.clientY};
 tile.setPointerCapture(event.pointerId);
}
function moveDrag(event){
 if(drag?.pointer!==event.pointerId)return;
 if(!drag.ghost){
  if(Math.hypot(drag.x-event.clientX,drag.y-event.clientY)<7)return;
  select(Number(drag.tile.dataset.word));
  drag.ghost=document.createElement('div');drag.ghost.className='tile ghost';
  drag.ghost.textContent=drag.tile.textContent;drag.ghost.setAttribute('aria-hidden','true');
  document.body.append(drag.ghost);
 }
 drag.ghost.style.left=event.clientX+'px';drag.ghost.style.top=event.clientY+'px';
 drag.slot?.classList.remove('hover');
 drag.slot=document.elementFromPoint(event.clientX,event.clientY)?.closest('.slot:not(:disabled)');
 drag.slot?.classList.add('hover');
}
function endDrag(event){
 if(drag?.pointer!==event.pointerId)return;
 const slot=drag.ghost&&drag.slot;
 stopDrag();
 if(slot)place(slot);
}
function clearConfetti(){cancelAnimationFrame(animation);ctx.clearRect(0,0,canvas.width,canvas.height);}
function celebrate(){
 clearConfetti();
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 canvas.width=innerWidth;canvas.height=innerHeight;
 const colors=['#1bb6a2','#ffb627','#376ddd','#eb627e','#884dc7'];
 const pieces=Array.from({length:155},(_,i)=>({
  x:canvas.width*(.12+.76*Math.random()),y:-Math.random()*canvas.height*.55,
  speed:200+Math.random()*310, drift:(Math.random()-.5)*155, spin:Math.random()*9,
  size:5+Math.random()*8,color:colors[i%colors.length]
 }));
 const start=performance.now();
 function draw(now){
  const time=(now-start)/1000;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(time>=3.8)return;
  ctx.globalAlpha=Math.min(1,(3.8-time)*2);
  for(const p of pieces){
   ctx.save();ctx.translate(p.x+p.drift*time,p.y+p.speed*time+60*time*time);ctx.rotate(time*p.spin);
   ctx.fillStyle=p.color;ctx.fillRect(0,0,p.size,p.size*.64);ctx.restore();
  }
  ctx.globalAlpha=1;animation=requestAnimationFrame(draw);
 }
 animation=requestAnimationFrame(draw);
}
function reset(){
 stopDrag();clearConfetti();filled=new Set();selected=null;
 sentence.replaceChildren();bank.replaceChildren();
 for(const part of parts){
  const element=document.createElement(typeof part==='number'?'button':'span');
  if(typeof part==='number'){
   element.className='slot';element.dataset.slot=part;element.textContent='…';
   element.setAttribute('aria-label','الفراغ '+digits.format(part+1));
   element.addEventListener('click',()=>place(element));
  }else{element.className='phrase';element.textContent=part;}
  sentence.append(element);
 }
 const order=words.map((_,i)=>i);
 for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
 if(order.every((id,i)=>id===i))order.push(order.shift());
 for(const id of order){
  const tile=document.createElement('button');
  tile.className='tile';tile.textContent=words[id];tile.dataset.word=id;tile.setAttribute('aria-pressed','false');
  tile.addEventListener('click',()=>select(id));
  tile.addEventListener('pointerdown',startDrag);tile.addEventListener('pointermove',moveDrag);
  tile.addEventListener('pointerup',endDrag);tile.addEventListener('pointercancel',stopDrag);
  tile.addEventListener('lostpointercapture',stopDrag);bank.append(tile);
 }
 update();message('');
}
document.querySelector('#reset').addEventListener('click',reset);
document.querySelector('#sound').addEventListener('click',event=>{
 muted=!muted;event.currentTarget.setAttribute('aria-pressed',String(!muted));
 event.currentTarget.textContent=muted?'الصوت مكتوم':'الصوت مفعّل';
 if(!muted)play([[660,0,.17]]);
});
reset();

const playArea=document.querySelector('.play-area');
const panel=playArea.querySelector('main');
function fitPage(){
 const scale=Math.min(1,playArea.clientHeight/panel.offsetHeight,playArea.clientWidth/panel.offsetWidth);
 if(scale>0)panel.style.setProperty('--fit',String(scale));
}
const fullscreenButton=document.querySelector('#fullscreen');
function updateFullscreen(){
 const active=Boolean(document.fullscreenElement);
 fullscreenButton.setAttribute('aria-pressed',String(active));
 fullscreenButton.textContent=active?'⛶ خروج من ملء الشاشة':'⛶ ملء الشاشة';
 fitPage();
}
fullscreenButton.addEventListener('click',async ()=>{
 try{
  if(document.fullscreenElement)await document.exitFullscreen();
  else if(document.fullscreenEnabled)await document.documentElement.requestFullscreen();
  else message('يمكنك استخدام وضع ملء الشاشة من قائمة المتصفح.');
 }catch{message('يمكنك استخدام وضع ملء الشاشة من قائمة المتصفح.');}
});
document.addEventListener('fullscreenchange',updateFullscreen);
window.addEventListener('resize',fitPage);
if('ResizeObserver' in window){
 const layoutObserver=new ResizeObserver(fitPage);
 layoutObserver.observe(playArea);layoutObserver.observe(panel);
}
fitPage();
</script>
</html>
