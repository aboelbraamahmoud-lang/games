<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة فرقع البالونات التعليمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4F46E5;
            --secondary: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --bg-color: #E0F2FE;
            --text-main: #1E293B;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Background Themes */
        .bg-sky { background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%); }
        .bg-carnival { background: repeating-linear-gradient(45deg, #FFB6C1, #FFB6C1 20px, #FFF0F5 20px, #FFF0F5 40px); }
        .bg-night { background: linear-gradient(180deg, #1A2980 0%, #26D0CE 100%); color: white !important;}
        .bg-islamic { background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%); }
        
        .bg-pattern {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.4;
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.8) 1px, transparent 0);
            background-size: 32px 32px;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
            100% { transform: translateY(0) rotate(-2deg); }
        }

        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; filter: brightness(1.5); }
            100% { transform: scale(0); opacity: 0; display: none; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }

        @keyframes scaleIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(251, 191, 36, 0); }
            100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
        }

        /* Balloon Styling */
        .balloon-container {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
            animation: float 4s ease-in-out infinite;
        }
        
        .balloon-container:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .balloon {
            width: 120px;
            height: 140px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            position: relative;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2), 5px 5px 15px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .balloon::after { /* Balloon string */
            content: '';
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 35px;
            background-color: rgba(255,255,255,0.7);
            z-index: -1;
        }
        
        .balloon::before { /* Balloon knot */
            content: '▲';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            color: inherit;
            font-size: 14px;
            text-shadow: 0 2px 2px rgba(0,0,0,0.2);
        }

        .balloon-number {
            font-size: 2.5rem;
            font-weight: 900;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
            z-index: 2;
        }

        .balloon.popping {
            animation: pop 0.2s forwards ease-out;
        }

        /* UI Elements */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 1.5rem;
        }

        .btn-3d {
            transition: all 0.1s;
            box-shadow: 0 6px 0px rgba(0,0,0,0.2);
            position: relative;
            top: 0;
        }
        
        .btn-3d:active {
            top: 6px;
            box-shadow: 0 0px 0px rgba(0,0,0,0.2);
        }

        .screen { display: none; }
        .screen.active { display: flex; animation: scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        .shake-err { animation: shake 0.5s; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>

<body class="min-h-screen flex flex-col relative transition-colors duration-500 bg-sky">
    <div class="bg-pattern"></div>

    <header id="main-header" class="w-full glass-panel mx-auto max-w-6xl mt-4 p-4 flex justify-between items-center z-40 transition-all" style="display: flex;">
        <div class="flex items-center gap-4">
            <!-- Ministry Logo Placeholder (SVG) -->
            <div class="w-16 h-16 bg-white rounded-full p-1 shadow-inner border-2 border-gray-200 flex items-center justify-center cursor-pointer" onclick="document.getElementById('logo-upload').click()" title="تغيير الشعار">
                <img id="ministry-logo" src="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;circle cx='50' cy='50' r='45' fill='%238b1538'/&gt;&lt;path d='M30,70 L50,30 L70,70 Z' fill='white'/&gt;&lt;/svg&gt;" class="w-full h-full object-contain rounded-full" alt="شعار">
                <input type="file" id="logo-upload" accept="image/*" class="hidden" onchange="handleLogoUpload(event)">
            </div>
            <div>
                <h1 id="header-school-name" class="text-xl font-bold text-gray-800">مدرسة عبد الله بن زيد آل محمود النموذجية</h1>
                <h2 id="header-department" class="text-md text-gray-600">قسم التربية الإسلامية</h2>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="toggleAudio()" class="text-2xl text-gray-600 hover:text-blue-500 transition btn-3d bg-white p-3 rounded-full w-14 h-14 flex items-center justify-center">
                <i id="audio-icon" class="fas fa-volume-up"></i>
            </button>
            <button onclick="toggleFullScreen()" class="text-2xl text-gray-600 hover:text-blue-500 transition btn-3d bg-white p-3 rounded-full w-14 h-14 flex items-center justify-center">
                <i class="fas fa-expand"></i>
            </button>
            <!-- Teacher Dashboard Button (Will be removed in student export) -->
            
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 relative w-full h-full">

        <!-- Splash / Start Screen -->
        <div id="screen-splash" class="screen flex-col items-center justify-center text-center max-w-3xl w-full">
            <h1 id="game-main-title" class="text-6xl md:text-8xl font-black text-white drop-shadow-lg mb-6 leading-tight" style="-webkit-text-stroke: 2px #4F46E5;">لعبة فرقع البالونات</h1>
            <p id="game-sub-title" class="text-2xl md:text-3xl font-bold text-yellow-300 drop-shadow-md mb-12">
                تعلم وامرح!
            </p>
            <button onclick="showScreen('screen-mode-select')" class="bg-yellow-400 hover:bg-yellow-300 text-yellow-900 text-4xl font-bold py-6 px-16 rounded-full btn-3d border-4 border-white shadow-xl animate-bounce">
                ابـــــدأ اللعـــــب <i class="fas fa-play mr-4"></i>
            </button>
        </div>

        <!-- Mode Selection Screen -->
        <div id="screen-mode-select" class="screen flex-col items-center justify-center w-full max-w-4xl">
            <h2 class="text-5xl font-bold text-white drop-shadow-lg mb-12">اختر طريقة اللعب</h2>
            <div class="flex flex-col md:flex-row gap-8 w-full justify-center">
                <button onclick="setupGame('solo')" class="glass-panel p-10 flex flex-col items-center btn-3d hover:scale-105 group w-full md:w-1/3">
                    <i class="fas fa-user text-7xl text-blue-500 mb-6 group-hover:animate-bounce"></i>
                    <span class="text-3xl font-bold">لاعب واحد</span>
                </button>
                <button onclick="setupGame('team')" class="glass-panel p-10 flex flex-col items-center btn-3d hover:scale-105 group w-full md:w-1/3">
                    <i class="fas fa-users text-7xl text-green-500 mb-6 group-hover:animate-bounce"></i>
                    <span class="text-3xl font-bold">فريقان</span>
                </button>
            </div>
            <button onclick="showScreen('screen-splash')" class="mt-12 text-2xl bg-white text-gray-700 py-3 px-8 rounded-full btn-3d">عودة</button>
        </div>

        <!-- Player/Team Names Setup Screen -->
        <div id="screen-names" class="screen flex-col items-center justify-center w-full max-w-2xl glass-panel p-10">
            <h2 class="text-4xl font-bold text-gray-800 mb-8" id="names-title">اسم اللاعب</h2>
            
            <div id="solo-name-input" class="w-full mb-6">
                <label class="block text-2xl font-bold mb-3">اسم البطل:</label>
                <input type="text" id="player-name" class="w-full p-4 text-2xl rounded-xl border-2 border-blue-300 text-center focus:outline-none focus:border-blue-500" value="بطل المستقبل">
            </div>

            <div id="team-names-input" class="w-full mb-6 hidden flex flex-col gap-6">
                <div>
                    <label class="block text-2xl font-bold mb-3 text-blue-600">اسم الفريق الأول:</label>
                    <input type="text" id="team1-name" class="w-full p-4 text-2xl rounded-xl border-2 border-blue-400 text-center focus:outline-none focus:border-blue-600 bg-blue-50" value="الفريق الأزرق">
                </div>

    <script>
        /**

         * When exported, this will be modified to true by the export script.
         * If true, it hides admin buttons and skips loading from localStorage.
         */
        const IS_STUDENT_VERSION = true;
        
        // --- CONSTANTS & CONFIG ---
        const BALLOON_COLORS = [
            {bg: '#FF3B30', text: '#fff'}, {bg: '#FF9500', text: '#fff'}, {bg: '#FFCC00', text: '#000'},
            {bg: '#4CD964', text: '#fff'}, {bg: '#5AC8FA', text: '#000'}, {bg: '#007AFF', text: '#fff'},
            {bg: '#5856D6', text: '#fff'}, {bg: '#FF2D55', text: '#fff'}, {bg: '#E024CE', text: '#fff'}
        ];

        // --- STATE MANAGEMENT ---
        let appState = {
            settings: {
                schoolName: "مدرسة عبد الله بن زيد آل محمود النموذجية",
                department: "قسم التربية الإسلامية",
                mainTitle: "لعبة فرقع البالونات",
                showHeader: true,
                bgTheme: "bg-sky",
                defaultPoints: 10,
                timer: 15,
                failAction: "next_turn", // or 'second_chance'
                audioEnabled: true
            },
            questions: [
                { id: 1, text: "ما هي أول سورة في القرآن الكريم؟", type: "mcq", points: 10, options: ["سورة البقرة", "سورة الفاتحة", "سورة الإخلاص", "سورة الناس"], correctIndex: 1 },
                { id: 2, text: "كم عدد الصلوات المفروضة في اليوم والليلة؟", type: "mcq", points: 10, options: ["3 صلوات", "4 صلوات", "5 صلوات", "6 صلوات"], correctIndex: 2 },
                { id: 3, text: "الصيام ركن من أركان الإسلام.", type: "tf", points: 10, options: ["صح", "خطأ"], correctIndex: 0 },
                { id: 4, text: "من هو خاتم الأنبياء والمرسلين؟", type: "mcq", points: 15, options: ["موسى عليه السلام", "عيسى عليه السلام", "إبراهيم عليه السلام", "محمد صلى الله عليه وسلم"], correctIndex: 3 },
                { id: 5, text: "الكذب صفة محمودة في الإسلام.", type: "tf", points: 10, options: ["صح", "خطأ"], correctIndex: 1 },
                { id: 6, text: "ما هو الشهر الذي نصوم فيه؟", type: "mcq", points: 10, options: ["شعبان", "رمضان", "شوال", "محرم"], correctIndex: 1 }
            ],
            session: {
                mode: 'solo', // 'solo' or 'team'
                p1Name: 'بطل المستقبل', p2Name: 'الفريق الثاني',
                p1Score: 0, p2Score: 0,
                currentTurn: 1, // 1 for P1, 2 for P2
                answeredQuestions: [], // IDs of answered questions
                currentQuestionObj: null,
                timerInterval: null,
                isGameOver: false
            }
        };

        // If a pre-baked state exists (in student version), it will be declared here by the export script.
        appState = {"settings":{"schoolName":"مدرسة عبد الله بن زيد آل محمود النموذجية","department":"قسم التربية الإسلامية","mainTitle":"لعبة فرقع البالونات","showHeader":true,"bgTheme":"bg-sky","defaultPoints":10,"timer":15,"failAction":"next_turn","audioEnabled":true},"questions":[{"id":1,"text":"أوصانا الرسول صلى الله عليه وسلم بالحرص على الأعمال الصالحة:","type":"tf","points":10,"options":["صح","خطأ"],"correctIndex":0,"colorIndex":0},{"id":2,"text":"مما يسافاد من الحديث الشريف :","type":"mcq","points":10,"options":["الحرص على الأعمال الصالحة ومنها الصلاة على وقتها وبر الوالدين","أجر الحج الكبير","أجر الصوم الكبير","أجر الزكاة والصدقة الكبير"],"correctIndex":0,"colorIndex":3},{"id":3,"text":"يجب على المسلم المحافظة على ................ في وقتها.","type":"mcq","points":10,"options":["الزكاة","الصلاة","الصدقة","الحج"],"correctIndex":1,"colorIndex":2}],"session":{"mode":"solo","p1Name":"بطل المستقبل","p2Name":"الفريق الثاني","p1Score":0,"p2Score":0,"currentTurn":1,"answeredQuestions":[2,4],"currentQuestionObj":{"id":4,"text":"من هو خاتم الأنبياء والمرسلين؟","type":"mcq","points":15,"options":["موسى عليه السلام","عيسى عليه السلام","إبراهيم عليه السلام","محمد صلى الله عليه وسلم"],"correctIndex":3},"timerInterval":37,"isGameOver":false}};
// INJECT_STUDENT_STATE_HERE

        // --- INITIALIZATION ---
        function initApp() {
            if (IS_STUDENT_VERSION) {
                // In student version, hide admin button
                const adminBtn = document.getElementById('btn-dashboard-access');
                if(adminBtn) adminBtn.style.display = 'none';
                
                // If student version, appState is already populated by injection.
            } else {
                // Teacher version: load from localStorage if exists
                const savedState = localStorage.getItem('balloonGameData');
                if (savedState) {
                    const parsed = JSON.parse(savedState);
                    appState.settings = { ...appState.settings, ...parsed.settings };
                    appState.questions = parsed.questions || appState.questions;
                }
            }

            // Always clear session data on load (Rule 21)
            resetSession();
            applySettingsToUI();
            
            // Show splash
            showScreen('screen-splash');
            
            // Pre-init Audio Context slightly to unlock it (requires user interaction later though)
            initAudioContext();
        }

        function resetSession() {
            appState.session = {
                mode: 'solo',
                p1Name: 'بطل المستقبل', p2Name: 'الفريق الثاني',
                p1Score: 0, p2Score: 0,
                currentTurn: 1,
                answeredQuestions: [],
                currentQuestionObj: null,
                timerInterval: null,
                isGameOver: false
            };
        }

        function applySettingsToUI() {
            // Header text
            document.getElementById('header-school-name').textContent = appState.settings.schoolName;
            document.getElementById('header-department').textContent = appState.settings.department;
            document.getElementById('game-main-title').textContent = appState.settings.mainTitle;
            
            // Header visibility
            document.getElementById('main-header').style.display = appState.settings.showHeader ? 'flex' : 'none';
            
            // Background Theme
            document.body.className = `min-h-screen flex flex-col relative transition-colors duration-500 ${appState.settings.bgTheme}`;
            
            // Dashboard inputs update
            if (!IS_STUDENT_VERSION) {
                document.getElementById('set-school').value = appState.settings.schoolName;
                document.getElementById('set-dept').value = appState.settings.department;
                document.getElementById('set-title').value = appState.settings.mainTitle;
                document.getElementById('set-header').value = appState.settings.showHeader.toString();
                document.getElementById('set-points').value = appState.settings.defaultPoints;
                document.getElementById('set-timer').value = appState.settings.timer;
                document.getElementById('set-fail-action').value = appState.settings.failAction;
                renderQuestionsTable();
            }

            // Audio Icon
            updateAudioIcon();
        }

        function updateSetting(key, value) {
            appState.settings[key] = value;
            saveDataLocally();
            applySettingsToUI();
        }

        function saveDataLocally() {
            if (IS_STUDENT_VERSION) return;
            // Only save settings and questions, not session
            const dataToSave = {
                settings: appState.settings,
                questions: appState.questions
            };
            localStorage.setItem('balloonGameData', JSON.stringify(dataToSave));
        }

        // --- SCREEN MANAGEMENT ---
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => {
                el.classList.remove('active');
                if (el.id !== 'screen-dashboard' && el.id !== 'modal-question' && el.id !== 'modal-edit-question') {
                    // Hide generic screens properly based on structure
                    // Using inline styles for hidden ones might conflict with flex, so rely on class toggle.
                }
            });
            const target = document.getElementById(screenId);
            if(target) {
                if(screenId === 'screen-dashboard' || screenId === 'modal-question' || screenId === 'modal-edit-question' || screenId === 'screen-result') {
                     target.style.display = 'flex';
                     setTimeout(() => target.classList.add('active'), 10);
                } else {
                     target.classList.add('active');
                }
            }
        }

        function hideScreen(screenId) {
            const target = document.getElementById(screenId);
            if(target) {
                target.classList.remove('active');
                setTimeout(() => target.style.display = 'none', 300); // match animation duration
            }
        }

        function setupGame(mode) {
            appState.session.mode = mode;
            document.getElementById('solo-name-input').classList.toggle('hidden', mode !== 'solo');
            document.getElementById('team-names-input').classList.toggle('hidden', mode !== 'team');
            document.getElementById('names-title').textContent = mode === 'solo' ? 'اسم اللاعب' : 'أسماء الفرق';
            showScreen('screen-names');
        }

        function startGame() {
            // Unlock audio context on user gesture
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            // Set names
            if (appState.session.mode === 'solo') {
                appState.session.p1Name = document.getElementById('player-name').value || 'بطل المستقبل';
            } else {
                appState.session.p1Name = document.getElementById('team1-name').value || 'الفريق الأزرق';
                appState.session.p2Name = document.getElementById('team2-name').value || 'الفريق الأحمر';
            }

            // Setup UI
            document.getElementById('display-name-1').textContent = appState.session.p1Name;
            document.getElementById('display-score-1').textContent = '0';
            
            if (appState.session.mode === 'team') {
                document.getElementById('score-box-2').classList.remove('hidden');
                document.getElementById('display-name-2').textContent = appState.session.p2Name;
                document.getElementById('display-score-2').textContent = '0';
                document.getElementById('turn-indicator').classList.remove('hidden');
                updateTurnIndicator();
            } else {
                document.getElementById('score-box-2').classList.add('hidden');
                document.getElementById('turn-indicator').classList.add('hidden');
            }

            appState.session.answeredQuestions = [];
            generateBalloons();
            showScreen('screen-game');
            playSound('start');
        }

        function updateTurnIndicator() {
            if(appState.session.mode !== 'team') return;

            const name = appState.session.currentTurn === 1 ? appState.session.p1Name : appState.session.p2Name;

            turnEl.innerHTML = `دور: <span class="${colorClass}">${name}</span>`;

        // --- BALLOON ENGINE ---
        function generateBalloons() {
            const area = document.getElementById('balloons-area');
            area.innerHTML = '';
            
            // Shuffle questions and select up to a reasonable amount, or all of them.
            // For this version, we map 1 balloon = 1 question.
            let availableQuestions = appState.questions.filter(q => !appState.session.answeredQuestions.includes(q.id));
            
            if(availableQuestions.length === 0) {
                // Game over logically, shouldn't happen here but safe check
                finishGame();
                return;
            }

            availableQuestions.forEach((q, index) => {
                let colorObj;
                if (q.colorIndex !== undefined && q.colorIndex >= 0 && q.colorIndex < BALLOON_COLORS.length) {
                    colorObj = BALLOON_COLORS[q.colorIndex];
                } else {
                    colorObj = BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)];
                }
                
                const delay = Math.random() * 2; // Random animation delay
                
                const bContainer = document.createElement('div');
                bContainer.className = 'balloon-container';
                bContainer.style.animationDelay = `${delay}s`;
                bContainer.onclick = () => handleBalloonClick(bContainer, q);

                const balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.style.backgroundColor = colorObj.bg;
                balloon.style.color = colorObj.bg; // For the knot
                
                const num = document.createElement('span');
                num.className = 'balloon-number';
                num.style.color = colorObj.text;
                // Add a star icon if it's a high point question (relative to default)
                if(q.points > appState.settings.defaultPoints) {
                     num.innerHTML = `<i class="fas fa-star text-yellow-300 text-3xl"></i>`;
                } else {
                     num.textContent = index + 1; // Visual number, not ID
                }

                balloon.appendChild(num);
                bContainer.appendChild(balloon);
                area.appendChild(bContainer);
            });
        }

        function handleBalloonClick(element, question) {
            const balloon = element.querySelector('.balloon');
            
            // Pop effect
            balloon.classList.add('popping');
            playSound('pop');
            createParticles(element.getBoundingClientRect());

            // Remove from DOM slightly after animation
            setTimeout(() => {
                element.style.visibility = 'hidden'; // Keep layout space but hide
                element.onclick = null; // disable
            }, 200);

            // Setup Question Modal
            setTimeout(() => {
                showQuestion(question);
            }, 500);
        }

        // --- QUESTION & GAMEPLAY LOGIC ---
        function showQuestion(questionObj) {
            appState.session.currentQuestionObj = questionObj;
            
            document.getElementById('q-number-display').textContent = appState.session.answeredQuestions.length + 1;
            document.getElementById('q-points-display').innerHTML = `<i class="fas fa-star text-yellow-400"></i> ${questionObj.points} نقطة`;
            document.getElementById('q-text').textContent = questionObj.text;
            
            const optionsContainer = document.getElementById('q-options');
            optionsContainer.innerHTML = '';
            
            // Generate option buttons
            questionObj.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'w-full py-6 px-4 text-2xl font-bold bg-gray-50 border-4 border-gray-200 rounded-2xl hover:bg-blue-50 hover:border-blue-400 transition-all btn-3d shadow-md';
                btn.textContent = opt;
                btn.onclick = () => handleAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('question-card').classList.remove('shake-err');
            document.getElementById('modal-question').classList.remove('hidden');
            
            startTimer();
        }

        function handleAnswer(selectedIndex, btnElement) {
            clearInterval(appState.session.timerInterval);
            const q = appState.session.currentQuestionObj;
            const isCorrect = selectedIndex === q.correctIndex;
            
            // Disable all buttons
            const btns = document.getElementById('q-options').querySelectorAll('button');
            btns.forEach(b => b.onclick = null);

            if (isCorrect) {
                // Correct
                btnElement.classList.replace('bg-gray-50', 'bg-green-500');
                btnElement.classList.replace('border-gray-200', 'border-green-600');
                btnElement.classList.add('text-white');
                playSound('correct');
                triggerConfetti();
                addPoints(q.points);
                
                setTimeout(() => {
                    closeQuestionAndNext();
                }, 2000);

            } else {
                // Wrong
                btnElement.classList.replace('bg-gray-50', 'bg-red-500');
                btnElement.classList.replace('border-gray-200', 'border-red-600');
                btnElement.classList.add('text-white');
                playSound('wrong');
                document.getElementById('question-card').classList.add('shake-err');
                
                // Highlight correct answer
                btns[q.correctIndex].classList.replace('bg-gray-50', 'bg-green-100');
                btns[q.correctIndex].classList.replace('border-gray-200', 'border-green-400');

                setTimeout(() => {
                    document.getElementById('question-card').classList.remove('shake-err');
                    if (appState.session.mode === 'team' && appState.settings.failAction === 'next_turn') {
                        // Switch turn without points
                        closeQuestionAndNext(false); 
                    } else {
                        // Solo or second_chance team mode: just move on
                        closeQuestionAndNext(false);
                    }
                }, 2500);
            }
        }

        function addPoints(points) {
            const isP1 = appState.session.currentTurn === 1;
            if (isP1) {
                appState.session.p1Score += points;
                animateScoreUpdate('display-score-1', appState.session.p1Score);
            } else {
                appState.session.p2Score += points;
                animateScoreUpdate('display-score-2', appState.session.p2Score);
            }
        }

            el.textContent = newScore;

        function checkGameEnd() {
            if (appState.session.answeredQuestions.length >= appState.questions.length) {
                finishGame();
            } else {
                // Re-render balloons to remove the blank space if desired, or keep spaces.
                // Keeping spaces is fine, but if we want to repack:

            }

        function startTimer() {
            const timerVal = appState.settings.timer;
            const timerContainer = document.getElementById('timer-container');
            const timerText = document.getElementById('timer-text');
            const timerCircle = document.getElementById('timer-circle');
            
            clearInterval(appState.session.timerInterval);

            if (timerVal <= 0) {
                timerContainer.classList.add('hidden');
                return;
            }

            timerContainer.classList.remove('hidden');
            let timeLeft = timerVal;
            const fullDash = 251; // Circumference of r=40
            
            timerText.textContent = timeLeft;
            timerCircle.style.strokeDashoffset = '0';
            timerCircle.style.stroke = '#3B82F6'; // Blue

            appState.session.timerInterval = setInterval(() => {
                timeLeft--;
                timerText.textContent = timeLeft;
                
                // Calculate offset (1 - (left/total)) * fullDash
                const offset = fullDash - ((timeLeft / timerVal) * fullDash);
                timerCircle.style.strokeDashoffset = offset;

                if (timeLeft <= 5) {
                    timerCircle.style.stroke = '#EF4444'; // Red
                    playSound('tick');
                }

                if (timeLeft <= 0) {
                    clearInterval(appState.session.timerInterval);
                    playSound('wrong');
                    handleTimeOut();
                }
            }, 1000);
        }

        function handleTimeOut() {
            const btns = document.getElementById('q-options').querySelectorAll('button');
            btns.forEach(b => b.onclick = null); // disable
            
            document.getElementById('q-text').textContent = "انتهى الوقت!";
            document.getElementById('question-card').classList.add('shake-err');

            setTimeout(() => {

        // --- AUDIO SYSTEM ---
        let audioCtx;
        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function toggleAudio() {
            appState.settings.audioEnabled = !appState.settings.audioEnabled;
            updateAudioIcon();
        }
        
        function updateAudioIcon() {
            const icon = document.getElementById('audio-icon');
            if(appState.settings.audioEnabled) {
                icon.className = 'fas fa-volume-up';
                icon.parentElement.classList.remove('text-red-500');
            } else {
                icon.className = 'fas fa-volume-mute';
                icon.parentElement.classList.add('text-red-500');
            }
        }

        function playSound(type) {
            if (!appState.settings.audioEnabled || !audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            switch(type) {
                case 'pop':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                    gainNode.gain.setValueAtTime(1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;
                case 'correct':
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.setValueAtTime(600, now + 0.1);
                    osc.frequency.setValueAtTime(800, now + 0.2);
                    gainNode.gain.setValueAtTime(0, now);
                    gainNode.gain.linearRampToValueAtTime(0.5, now + 0.1);
                    gainNode.gain.linearRampToValueAtTime(0, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                    break;
                case 'wrong':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                    gainNode.gain.setValueAtTime(0.5, now);
                    gainNode.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;
                case 'tick':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(1000, now);
                    gainNode.gain.setValueAtTime(0.1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                    break;
                case 'start':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(600, now + 0.2);
                    gainNode.gain.setValueAtTime(0.2, now);
                    gainNode.gain.linearRampToValueAtTime(0, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                    break;
                case 'win':
                    // Simple chord-like arpeggio
                    [440, 554.37, 659.25, 880].forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'triangle';
                        o.frequency.value = freq;
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        g.gain.setValueAtTime(0, now + (i*0.15));
                        g.gain.linearRampToValueAtTime(0.3, now + (i*0.15) + 0.05);
                        g.gain.linearRampToValueAtTime(0, now + 1.5);
                        o.start(now + (i*0.15));
                        o.stop(now + 2);
                    });
                    break;
            }
        }

        // --- VISUAL EFFECTS ---
        function createParticles(rect) {
            const colors = ['#facc15', '#f87171', '#60a5fa', '#34d399'];
            for(let i=0; i<15; i++) {
                const p = document.createElement('div');
                p.style.position = 'absolute';
                p.style.left = (rect.left + rect.width/2) + 'px';
                p.style.top = (rect.top + rect.height/2) + 'px';
                p.style.width = '10px';
                p.style.height = '10px';
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                p.style.borderRadius = '50%';
                p.style.pointerEvents = 'none';
                p.style.zIndex = '100';
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 50 + Math.random() * 50;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity - 50; // slight upward bias

                p.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                ], { duration: 600, easing: 'cubic-bezier(0, .9, .57, 1)' });

                document.body.appendChild(p);
                setTimeout(() => p.remove(), 600);
            }
        }

        // Fallback Confetti using DOM if external canvas-confetti is not loaded, but let's implement a simple DOM one for self-containment
        function triggerConfetti(massive = false) {
            const count = massive ? 100 : 30;
            const colors = ['#facc15', '#f87171', '#60a5fa', '#34d399', '#a78bfa'];
            
            for(let i=0; i<count; i++) {
                const conf = document.createElement('div');
                conf.style.position = 'fixed';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = '-10px';
                conf.style.width = (Math.random() * 10 + 5) + 'px';
                conf.style.height = (Math.random() * 20 + 10) + 'px';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.zIndex = '9999';
                conf.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                document.body.appendChild(conf);

                const duration = Math.random() * 2000 + 2000;
                conf.animate([
                    { transform: `translate3d(0,0,0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate3d(${Math.random()*200 - 100}px, 100vh, 0) rotate(${Math.random()*720}deg)`, opacity: 0 }
                ], { duration: duration, easing: 'linear' });

                setTimeout(() => conf.remove(), duration);
            }
        }

        function addEditorOption(text = '', isCorrect = false, isTF = false) {
            const list = document.getElementById('eq-options-list');
            const idx = editorOptionCount++;
            
            const div = document.createElement('div');
            div.className = 'flex items-center gap-3 bg-white p-2 rounded border';
            
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'eq-correct-idx';
            radio.value = idx;
            radio.className = 'w-5 h-5 cursor-pointer';
            if (isCorrect) radio.checked = true;

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'flex-grow p-2 border rounded opt-text focus:border-blue-500 outline-none';
            input.value = text;
            if(isTF) input.readOnly = true; // Lock text for True/False

            const btnDel = document.createElement('button');
            btnDel.innerHTML = '<i class="fas fa-times text-red-500"></i>';
            btnDel.className = 'p-2 hover:bg-red-50 rounded';
            btnDel.onclick = () => { if(editorOptionCount > 2) { div.remove(); } else { alert('يجب أن يحتوي السؤال على خيارين على الأقل');} };
            if(isTF) btnDel.style.display = 'none';

            div.appendChild(radio);
            div.appendChild(input);
            div.appendChild(btnDel);

        function saveQuestion() {
            const idVal = document.getElementById('eq-id').value;
            const text = document.getElementById('eq-text').value.trim();
            const type = document.getElementById('eq-type').value;
            const points = parseInt(document.getElementById('eq-points').value) || 10;
            
            if(!text) { alert('الرجاء إدخال نص السؤال'); return; }

            const optDivs = document.getElementById('eq-options-list').children;
            let options = [];
            let correctIndex = 0;
            let checkedFound = false;

            for(let i=0; i<optDivs.length; i++) {
                const val = optDivs[i].querySelector('.opt-text').value.trim();
                const isChecked = optDivs[i].querySelector('input[type="radio"]').checked;
                
                if(!val) { alert('الرجاء تعبئة جميع الخيارات أو حذف الخيارات الفارغة'); return; }
                options.push(val);
                if(isChecked) { correctIndex = i; checkedFound = true; }
            }

            if(!checkedFound) { alert('الرجاء تحديد الإجابة الصحيحة'); return; }

            const newQ = {
                id: idVal ? parseInt(idVal) : Date.now(),
                text, type, points, options, correctIndex,
                colorIndex: editorSelectedColorIndex
            };

            if(idVal) {
                const idx = appState.questions.findIndex(q => q.id === parseInt(idVal));
                if(idx > -1) appState.questions[idx] = newQ;
            } else {
                appState.questions.push(newQ);
            }

            saveDataLocally();
            renderQuestionsTable();
            closeQuestionEditor();
        }

        function editQuestion(id) {
            openQuestionModal(id);
        }

        // --- DATA MANAGEMENT ---
        function exportDataJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({settings: appState.settings, questions: appState.questions}));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href",     dataStr     );
            dlAnchorElem.setAttribute("download", "balloon_game_backup.json");
            dlAnchorElem.click();
        }

        function importDataJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if(parsed.settings && parsed.questions) {
                        appState.settings = parsed.settings;
                        appState.questions = parsed.questions;
                        saveDataLocally();
                        applySettingsToUI();
                        alert('تم استيراد البيانات بنجاح!');
                    } else {
                        alert('ملف غير صالح');
                    }
                } catch(err) {
                    alert('خطأ في قراءة الملف');
                }
            };
            reader.readAsText(file);
        }

        function factoryReset() {
            if(confirm('تحذير: سيتم مسح جميع الأسئلة والإعدادات! هل أنت متأكد؟')) {
                localStorage.removeItem('balloonGameData');
                location.reload();
            }
        }

        /**
         * EXPORT STUDENT VERSION
         * This function reads the current HTML, modifies the JS to hardcode
         * the current appState, changes the IS_STUDENT_VERSION flag,
         * removes the dashboard HTML, and triggers a download.
         */
        function exportStudentVersion() {
            alert("جاري تجهيز النسخة... سيتم تحميل الملف بعد قليل. \nيمكنك إرسال هذا الملف للطلاب للعب مباشرة بدون لوحة التحكم.");
            
            // 1. Get entire HTML
            let htmlContent = document.documentElement.outerHTML;

            // 2. Remove Teacher Dashboard element to keep file clean
            // We use Regex to remove the block between <!-- Teacher Dashboard --> and the end of its div.
            // A safer DOM way:
            const tempDoc = new DOMParser().parseFromString(htmlContent, 'text/html');
            const dashEl = tempDoc.getElementById('screen-dashboard');
            if(dashEl) dashEl.remove();
            
            const btnAccess = tempDoc.getElementById('btn-dashboard-access');
            if(btnAccess) btnAccess.remove();
            
            // Re-serialize
            htmlContent = "<!DOCTYPE html>\n" + tempDoc.documentElement.outerHTML;

            // 3. Inject State and modify flag
            // Find the constant and modify it
            htmlContent = htmlContent.replace(
                'const IS_STUDENT_VERSION = false;', 
                'const IS_STUDENT_VERSION = true;'
            );

            // Clean the state to not include session data, only questions/settings
            const stateToInject = {
                settings: appState.settings,
                questions: appState.questions,
                session: { ...appState.session } // Will be reset on init anyway
            };

            const injectionString = `appState = ${JSON.stringify(stateToInject)};\n// INJECT_STUDENT_STATE_HERE`;
            
            htmlContent = htmlContent.replace('// INJECT_STUDENT_STATE_HERE', injectionString);

            // 4. Trigger Download
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `لعبة_البالونات_نسخة_الطلاب.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Boot up
        window.onload = initApp;

    </script>
