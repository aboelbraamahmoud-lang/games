<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>عَجَلَةُ التَّفْسِيرِ | مَعَانِي مُفْرَدَاتِ سُورَةِ الْفُرْقَانِ</title>
  <style>
    :root{
      --cream:#fffaf0;--paper:#fffef9;--ink:#17393b;--soft:#58706f;
      --teal:#0f766e;--teal2:#07554f;--mint:#dff3ed;--maroon:#7f1d3f;
      --gold:#d8a83e;--gold2:#fff0b8;--navy:#173f56;--green:#178454;--red:#b43a48;
      --shadow:0 24px 65px rgba(19,55,57,.18);--wheel:min(38vw,61vh,580px)
    }
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0;background:var(--cream);-webkit-text-size-adjust:100%;text-size-adjust:100%}
    html{overscroll-behavior:none}body{overflow-x:hidden;color:var(--ink);font-family:"Noto Kufi Arabic","Tajawal",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
    button,input,textarea,select{font:inherit;-webkit-tap-highlight-color:transparent}button{touch-action:manipulation;-webkit-user-select:none;user-select:none}input,textarea,select{font-size:16px}
    button:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid rgba(216,168,62,.58);outline-offset:3px}
    #app{min-height:100vh;min-height:calc(var(--vh,1vh)*100);min-height:100dvh}
    .shell{position:relative;min-height:100vh;min-height:calc(var(--vh,1vh)*100);min-height:100dvh;isolation:isolate;overflow:hidden}
    .pattern{position:absolute;inset:0;z-index:-2;opacity:.29;background-image:
      linear-gradient(30deg,rgba(15,118,110,.11) 12%,transparent 12.5%,transparent 87%,rgba(15,118,110,.11) 87.5%),
      linear-gradient(150deg,rgba(15,118,110,.11) 12%,transparent 12.5%,transparent 87%,rgba(15,118,110,.11) 87.5%),
      linear-gradient(30deg,rgba(127,29,63,.07) 12%,transparent 12.5%,transparent 87%,rgba(127,29,63,.07) 87.5%),
      linear-gradient(150deg,rgba(127,29,63,.07) 12%,transparent 12.5%,transparent 87%,rgba(127,29,63,.07) 87.5%);
      background-position:0 0,0 0,48px 84px,48px 84px;background-size:96px 168px}
    .setup,.results{display:grid;place-items:center;padding:clamp(12px,2.2vw,34px);overflow:auto;background:
      radial-gradient(circle at 50% 0,rgba(216,168,62,.25),transparent 31%),
      linear-gradient(145deg,#fffdf8 0,#f8efdc 58%,#eef5ef 100%)}
    .corner:before,.corner:after{position:fixed;width:min(24vw,300px);aspect-ratio:1;z-index:-1;content:"";opacity:.3;border:3px solid var(--gold);transform:rotate(45deg);background:repeating-radial-gradient(circle,transparent 0 15px,rgba(216,168,62,.18) 16px 18px)}
    .corner:before{top:-13vw;right:-9vw}.corner:after{bottom:-13vw;left:-9vw}
    .card{width:min(1450px,96vw);position:relative;padding:clamp(14px,2vw,30px) clamp(14px,2.3vw,40px) 14px;border:1px solid rgba(216,168,62,.55);border-radius:30px;background:rgba(255,254,249,.97);box-shadow:var(--shadow)}
    .card:before{position:absolute;inset:8px;border:1px solid rgba(216,168,62,.32);border-radius:24px;content:"";pointer-events:none}
    .brand{text-align:center}.logo{width:176px;height:98px;margin:0 auto 3px;display:block;object-fit:contain;border-radius:10px;background:#fff}
    .school{margin:2px 0 0;color:var(--maroon);font-size:clamp(13px,1.12vw,17px);font-weight:900}
    .orn{width:min(430px,76%);margin:8px auto 2px;display:flex;align-items:center;gap:11px;color:var(--gold)}
    .orn:before,.orn:after{height:2px;flex:1;background:linear-gradient(90deg,transparent,var(--gold),transparent);content:""}.orn b{font-size:20px}
    h1{margin:0;color:var(--teal2);font-family:"Traditional Arabic","Noto Naskh Arabic",Tahoma,serif;font-size:clamp(36px,4vw,66px);line-height:1;font-weight:900;text-shadow:0 3px 0 rgba(216,168,62,.14)}
    .subtitle{margin:7px 0 0;color:var(--soft);font-size:clamp(14px,1.3vw,19px);font-weight:800}
    .setup-grid{margin-top:clamp(14px,1.7vw,25px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,1.6vw,24px)}
    fieldset{min-width:0;margin:0;padding:16px;border:1px solid rgba(15,118,110,.24);border-radius:21px;background:linear-gradient(160deg,#fff,rgba(239,248,244,.9))}
    legend{padding:0 10px;color:var(--teal2);font-size:clamp(16px,1.3vw,20px);font-weight:900}
    .mode-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    .select-card,.level{position:relative;border:2px solid #dce9e5;border-radius:16px;background:#fff;color:var(--ink);cursor:pointer;transition:.16s transform,.16s border-color,.16s box-shadow,.16s background}
    .select-card:hover,.level:hover{transform:translateY(-2px);border-color:rgba(15,118,110,.6)}
    .select-card.on,.level.on{border-color:var(--teal);background:linear-gradient(135deg,#fff,var(--mint));box-shadow:0 8px 22px rgba(15,118,110,.14),inset 0 0 0 2px #fff}
    .select-card{min-height:104px;padding:11px 8px;display:grid;place-items:center;gap:3px}
    .select-card .ico{font-size:30px}.select-card strong{font-size:16px}.select-card small,.level small,.timer-switch small{display:block;color:var(--soft);font-size:11px;font-weight:700;line-height:1.5}
    .names{margin-top:11px}.names label{display:grid;gap:5px;color:var(--soft);font-size:12px;font-weight:900}.team-inputs{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    input{width:100%;min-height:47px;padding:7px 12px;border:2px solid #dce8e4;border-radius:12px;background:#fff;color:var(--ink);font-size:15px;font-weight:800}
    input:focus{border-color:var(--teal)}
    .levels{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.level{min-height:104px;padding:9px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:7px;text-align:right}
    .level .emoji{font-size:29px}.level strong{font-size:15px}.level .tick{position:absolute;top:6px;left:7px;color:var(--teal);font-size:18px}
    .timer-switch{width:100%;min-height:59px;margin-top:11px;padding:8px 11px;border:1px solid rgba(216,168,62,.55);border-radius:15px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:#fffaf0;color:var(--ink);text-align:right;cursor:pointer}
    .timer-switch .clock{font-size:22px}.switch{width:48px;height:28px;padding:3px;border-radius:999px;display:flex;align-items:center;direction:ltr;background:#b8c4c1;transition:.18s}
    .switch b{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 5px #0003;transition:.18s}.timer-switch.on .switch{background:var(--teal)}.timer-switch.on .switch b{transform:translateX(20px)}
    .actions{margin:15px auto 0;display:flex;justify-content:center;align-items:center;gap:11px}.primary,.secondary,.rules{min-height:56px;padding:10px 20px;border-radius:16px;display:inline-flex;justify-content:center;align-items:center;gap:9px;font-weight:900;cursor:pointer;transition:.16s}
    .primary{min-width:min(300px,55vw);border:2px solid #f5d47d;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;font-size:clamp(16px,1.35vw,20px);box-shadow:0 12px 26px rgba(15,118,110,.25)}
    .secondary,.rules{border:2px solid #d7e5e0;background:#fff;color:var(--teal2)}.primary:hover,.secondary:hover,.rules:hover{transform:translateY(-2px) scale(1.01)}
    .icon-btn{width:48px;height:48px;flex:0 0 auto;border:1px solid rgba(15,118,110,.24);border-radius:14px;display:grid;place-items:center;background:#fff;color:var(--teal2);font-size:21px;cursor:pointer}
    .how{max-width:920px;margin:12px auto 0;padding:10px 15px;border:1px solid rgba(216,168,62,.55);border-radius:15px;display:flex;justify-content:center;align-items:center;gap:9px;background:linear-gradient(90deg,#fffaf0,#fff,#fffaf0);font-size:13px;font-weight:900;animation:drop .25s both}
    .how span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--maroon);color:#fff}.how i{width:25px;height:1px;background:var(--gold)}
    .credit{margin:11px 0 0;text-align:center;color:var(--soft);font-size:11px;font-weight:800}

    /* Game */
    .game{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;background:radial-gradient(circle at 80% 50%,rgba(216,168,62,.18),transparent 31%),linear-gradient(145deg,#f9f2e2,#edf5ef)}
    .topbar{min-height:82px;padding:8px clamp(14px,2.2vw,34px);border-bottom:1px solid rgba(216,168,62,.45);display:grid;grid-template-columns:minmax(330px,1.1fr) minmax(250px,.8fr) auto;align-items:center;gap:19px;background:rgba(255,254,249,.95);box-shadow:0 6px 18px rgba(23,57,59,.07);z-index:5}
    .mini-brand{display:flex;align-items:center;gap:13px}.mini-logo{width:112px;height:62px;object-fit:contain;background:#fff;border-radius:7px}.mini-brand div{display:grid;gap:2px}.mini-brand strong{color:var(--teal2);font-family:"Traditional Arabic",Tahoma,serif;font-size:clamp(22px,2vw,32px);line-height:1}.mini-brand span{color:var(--maroon);font-size:clamp(10px,.8vw,12px);font-weight:900}
    .progress{display:grid;gap:5px}.prog-label{display:flex;justify-content:space-between;color:var(--soft);font-size:12px;font-weight:900}.prog-label strong{color:var(--teal2)}
    .track,.master-track{height:12px;border-radius:999px;overflow:hidden;background:#dfe8e2;box-shadow:inset 0 2px 4px #17393b1a}.track i,.master-track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--teal),#2aa795,var(--gold));transition:width .45s}
    .tools{display:flex;gap:7px}.scorebar{min-height:64px;padding:8px clamp(14px,2.2vw,34px);display:flex;justify-content:center;align-items:center;gap:12px;background:linear-gradient(90deg,#0f766ef5,#07554ffa,#173f56f5);color:#fff;z-index:4}
    .chip,.team-score{min-height:45px;border:1px solid #ffffff3a;border-radius:14px;display:flex;align-items:center;gap:9px;background:#ffffff1a;font-weight:900}.chip{padding:8px 16px}.chip b{color:#ffe59a;font-size:20px}.chip.hot{border-color:#ffe59a;background:#d8a83e44;animation:pulse 1.3s infinite}
    .team-score{min-width:min(320px,33vw);padding:6px 16px;justify-content:center;position:relative;opacity:.7}.team-score b{min-width:55px;color:#ffe59a;font-size:22px;text-align:center}.team-score small{position:absolute;top:-8px;left:15px;padding:2px 7px;border-radius:99px;background:var(--gold);color:#3d2a07;font-size:10px}.team-score.active{opacity:1;transform:scale(1.025);border-color:#ffe59a;background:#ffffff31;box-shadow:0 0 0 3px #ffe59a22}.vs{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#3d2a07;font-size:12px;font-weight:900}
    .play{min-height:0;padding:clamp(10px,1.4vw,21px) clamp(14px,2.2vw,35px);display:grid;grid-template-columns:minmax(420px,.86fr) minmax(560px,1.14fr);gap:clamp(15px,2vw,31px)}
    .wheel-stage{min-height:0;position:relative;display:grid;place-items:center}.glow{position:absolute;width:calc(var(--wheel) + 52px);height:calc(var(--wheel) + 52px);border-radius:50%;background:radial-gradient(circle,#ffdf8188,#d8a83e22 56%,transparent 72%);animation:glow 3s infinite}
    .wheel{width:var(--wheel);height:var(--wheel);position:relative;z-index:2;overflow:hidden;border:clamp(9px,.8vw,14px) solid #e6bc5c;border-radius:50%;background:conic-gradient(from -22.5deg,#0f766e 0 45deg,#7f1d3f 45deg 90deg,#b78828 90deg 135deg,#173f56 135deg 180deg,#16857a 180deg 225deg,#96364e 225deg 270deg,#c99a39 270deg 315deg,#22566f 315deg 360deg);box-shadow:0 20px 40px #17393b3d,inset 0 0 0 6px #fff2bd,inset 0 0 35px #00000028;transition:transform 3.2s cubic-bezier(.08,.72,.12,1);will-change:transform}
    .wheel:before{position:absolute;inset:5.5%;z-index:1;border:2px solid #ffffff66;border-radius:50%;content:"";box-shadow:0 0 0 3px #d8a83e44}.wheel:after{position:absolute;inset:0;content:"";opacity:.12;background:repeating-conic-gradient(transparent 0 8deg,#fff 8deg 9deg)}
    .wheel-label{width:30%;position:absolute;top:50%;left:50%;z-index:3;display:grid;place-items:center;gap:2px;transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(var(--wheel)*-.34)) rotate(var(--u));color:#fff;font-size:clamp(10px,.86vw,15px);font-weight:900;line-height:1.35;text-align:center;text-shadow:0 2px 4px #0008}
    .wheel-label b{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#fffffff0;color:var(--teal2);font-size:11px;text-shadow:none}.wheel-label.used{opacity:.36;filter:saturate(.3)}
    .pointer{position:absolute;top:calc(50% - var(--wheel)/2 - 12px);left:50%;z-index:6;width:62px;height:74px;transform:translateX(-50%);background:linear-gradient(145deg,#ffe69c,var(--gold));clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 8px 5px #17393b48)}
    .spin{width:clamp(122px,10vw,158px);height:clamp(122px,10vw,158px);position:absolute;top:50%;left:50%;z-index:7;transform:translate(-50%,-50%);border:8px double #fff4c3;border-radius:50%;display:grid;place-items:center;align-content:center;gap:3px;background:radial-gradient(circle at 35% 28%,#ffeda8,var(--gold) 62%,#9d6e15);color:#3e2b08;font-weight:950;line-height:1.35;text-align:center;box-shadow:0 8px 22px #17393b61,inset 0 2px 6px #ffffffa6;cursor:pointer}.spin.ready{animation:spinPulse 1.5s infinite}.spin:disabled{opacity:1;cursor:default}.spin .spark{font-size:25px}.spinner{width:28px;height:28px;border:4px solid #3e2b0833;border-top-color:#3e2b08;border-radius:50%;animation:rotate .7s linear infinite}
    .panel{min-width:0;min-height:0;padding:clamp(14px,1.6vw,25px);border:1px solid rgba(216,168,62,.5);border-radius:28px;display:flex;flex-direction:column;position:relative;overflow:auto;background:rgba(255,254,249,.98);box-shadow:0 18px 44px #17393b20,inset 0 0 0 6px #fffaf0e6}
    .panel:before{position:absolute;top:0;right:7%;left:7%;height:5px;border-radius:0 0 99px 99px;content:"";background:linear-gradient(90deg,transparent,var(--gold),var(--teal),var(--gold),transparent)}
    .ready-panel{margin:auto;max-width:650px;display:grid;place-items:center;text-align:center}.lamp{width:clamp(82px,8vw,112px);height:clamp(82px,8vw,112px);margin-bottom:14px;border:2px solid #d8a83e99;border-radius:50% 50% 42% 42%;display:grid;place-items:center;background:radial-gradient(circle,#fff4bd,#f1d171 60%,#c9952d);font-size:40px;box-shadow:0 0 45px #d8a83e55;animation:float 2.8s infinite}
    .eyebrow{margin:0;color:var(--maroon);font-size:12px;font-weight:900}.ready-panel h2{margin:7px 0;color:var(--teal2);font-family:"Traditional Arabic",Tahoma,serif;font-size:clamp(32px,3.25vw,54px);line-height:1.2}.ready-panel p:last-of-type{margin:0;color:var(--soft);font-size:clamp(16px,1.35vw,21px);font-weight:800;line-height:1.8}.gesture{margin-top:23px;padding:12px 18px;border:1px solid #0f766e44;border-radius:99px;background:var(--mint);color:var(--teal2);font-size:14px;font-weight:900;animation:pulse 1.7s infinite}.gesture b{font-size:21px}
    .qtop{min-height:45px;display:flex;justify-content:space-between;align-items:center;gap:15px}.round{padding:7px 12px;border-radius:99px;background:var(--mint);color:var(--teal2);font-size:12px;font-weight:900}.timer{min-width:145px;display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:5px;color:var(--teal2)}.timer b{font-size:21px}.timer small{font-size:10px;font-weight:900}.timer i{height:4px;grid-column:1/-1;border-radius:99px;overflow:hidden;background:#dfe8e2}.timer i em{display:block;height:100%;background:var(--teal);transition:width 1s linear}.timer.urgent{color:var(--red);animation:urgent .7s infinite}.timer.urgent i em{background:var(--red)}
    .word{margin:9px 0 13px;padding:clamp(11px,1vw,16px) 18px;border:1px solid #d8a83e80;border-radius:19px;background:linear-gradient(90deg,#d8a83e12,transparent 22%,transparent 78%,#d8a83e12),#fffaf0;text-align:center}.word>span{color:var(--soft);font-size:12px;font-weight:900}.word div{display:flex;justify-content:center;align-items:center;gap:12px}.word h2{margin:3px 0 0;color:var(--maroon);font-family:"Traditional Arabic",Tahoma,serif;font-size:clamp(27px,2.7vw,47px);line-height:1.3}.speak{width:43px;height:43px;flex:0 0 auto;border:0;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 6px 13px #0f766e38}
    .options{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,.9vw,13px)}.option{min-height:clamp(76px,9.2vh,104px);padding:10px 12px;border:2px solid #dfe8e3;border-radius:18px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px;background:#fff;color:var(--ink);font-size:clamp(14px,1.12vw,18px);font-weight:900;line-height:1.65;text-align:right;box-shadow:0 6px 16px #17393b12;cursor:pointer;transition:.15s}.option:hover:not(:disabled){transform:translateY(-3px);border-color:var(--gold);box-shadow:0 11px 22px #17393b20}.option:disabled{opacity:.6;cursor:default}.option.correct{opacity:1;border-color:var(--green);background:#e8f7ef;color:#0b6540;box-shadow:0 0 0 4px #1784541f;animation:correct .5s}.letter{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--mint);color:var(--teal2);font-weight:950}.option.correct .letter{background:var(--green);color:#fff}
    .hint-row{min-height:50px;margin-top:10px;display:flex;align-items:center;gap:10px}.hint-btn{min-height:44px;padding:8px 13px;border:1px solid #d8a83e99;border-radius:13px;background:#fff7d9;color:#76510b;font-size:12px;font-weight:900;cursor:pointer}.hint-btn:disabled{opacity:.7}.hint-text{margin:0;padding:8px 12px;border-radius:13px;background:#fffaf0;color:#76510b;font-size:clamp(11px,.85vw,14px);font-weight:900;animation:drop .25s}
    .feedback{margin-top:10px;padding:11px;border:2px solid;border-radius:16px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px;animation:feedback .35s both}.feedback .big{font-size:28px}.feedback div{display:grid;gap:3px}.feedback strong{font-size:clamp(14px,1.05vw,17px)}.feedback span{font-size:clamp(12px,.9vw,14px);font-weight:800;line-height:1.5}.feedback.correct{border-color:#61b58a;background:#e9f8ef;color:#0c653f}.feedback.retry{border-color:#e3b94d;background:#fff7dc;color:#75500b}.feedback.wrong{border-color:#df7d84;background:#fff0f1;color:#8e2633}.next{min-height:47px;padding:8px 13px;border:0;border-radius:13px;background:var(--teal2);color:#fff;font-size:12px;font-weight:900;cursor:pointer}

    /* Results */

          const names=await caches.keys();
          await Promise.all(names.map(name=>caches.delete(name)));
        }
      }catch(e){}
      try{
        if("serviceWorker" in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg=>reg.unregister()));
        }

        if(indexedDB && typeof indexedDB.databases==="function"){
          const dbs=await indexedDB.databases();
          dbs.forEach(db=>{ if(db.name) indexedDB.deleteDatabase(db.name); });
        }
      }catch(e){}

        '<div class="actions"><button class="rules" data-act="how">📖 كَيْفَ نَلْعَبُ؟</button><button class="primary" data-act="start">✨ ابْدَأِ التَّحَدِّيَ ❮</button><button class="icon-btn" data-act="sound" aria-label="'+(state.sound?"إيقاف الأصوات":"تشغيل الأصوات")+'">'+(state.sound?"🔊":"🔇")+'</button></div>'+
        (state.showHow?'<div class="how"><span>١</span> أَدِرِ الْعَجَلَةَ <i></i><span>٢</span> اقْرَأِ الْمُفْرَدَةَ <i></i><span>٣</span> الْمَسِ الْمَعْنَى الصَّحِيحَ <i></i><span>٤</span> اجْمَعِ النُّجُومَ وَالنِّقَاطَ</div>':'')+
        (CONFIG.showAdmin?'<div class="setup-admin"><button class="admin-badge" data-act="admin">⚙️ لَوْحَةُ تَحَكُّمِ الْمُعَلِّمِ</button></div>':'')+
        (CONFIG.showTeacher&&CONFIG.teacherName?'<p class="credit">إِعْدَادُ: أ/ '+esc(CONFIG.teacherName)+'</p>':'')+'</section></main>';
    }

    function wheelGradient(){
      const step=360/Math.max(1,TERMS.length),colors=[CONFIG.primaryColor,CONFIG.secondaryColor,CONFIG.accentColor,"#173f56",shade(CONFIG.primaryColor,-18),shade(CONFIG.secondaryColor,22),shade(CONFIG.accentColor,-18),"#2f7068"];
      return "conic-gradient(from -"+(step/2)+"deg,"+TERMS.map((_,i)=>colors[i%colors.length]+" "+(i*step)+"deg "+((i+1)*step)+"deg").join(",")+")";
    }
    function wheelHTML(rotation=state.rotation){
      const step=360/Math.max(1,TERMS.length),dense=TERMS.length>12;
      const labels=TERMS.map((t,i)=>'<span class="wheel-label '+(state.used.includes(i)?"used ":"")+(dense?"dense":"")+'" style="--a:'+(i*step)+'deg;--u:'+(-i*step-rotation)+'deg"><b>'+(i+1)+'</b>'+(dense?"":esc(t.s))+'</span>').join("");
      return '<div class="wheel-stage"><div class="glow"></div><div class="pointer"></div><div id="wheel" class="wheel" style="background:'+wheelGradient()+';transform:rotate('+rotation+'deg)">'+labels+'</div>'+
        '<button id="spinBtn" class="spin '+(state.phase==="ready"?"ready":"")+'" data-act="spin" '+(state.phase!=="ready"?"disabled":"")+'>'+(state.phase==="spinning"?'<i class="spinner"></i><span>تَدُورُ...</span>':'<span class="spark">✦</span><span>أَدِرِ<br>الْعَجَلَةَ</span>')+'</button></div>';
    }

    function scoreHTML(){
      if(state.mode==="solo")return '<div class="chip">👤 <span>'+esc(state.solo||"بَطَلُ التَّفْسِيرِ")+'</span></div><div class="chip">🏅 <span>النِّقَاطُ</span><b>'+state.scores[0]+'</b></div><div class="chip '+(state.streak>=3?"hot":"")+'">✨ <span>التَّتَابُعُ</span><b>×'+state.streak+'</b></div>';
      return '<div class="team-score '+(state.active===0?"active":"")+'"><span>'+esc(state.teams[0])+'</span><b>'+state.scores[0]+'</b>'+(state.active===0?'<small>دَوْرُكُمْ</small>':'')+'</div><div class="vs">ضِدّ</div><div class="team-score '+(state.active===1?"active":"")+'"><span>'+esc(state.teams[1])+'</span><b>'+state.scores[1]+'</b>'+(state.active===1?'<small>دَوْرُكُمْ</small>':'')+'</div>';
    }

    function panelHTML(){
      if(state.phase==="ready"||state.phase==="spinning"){
        const title=state.phase==="spinning"?"تَرَقَّبِ السُّؤَالَ...":state.mode==="teams"?"الدَّوْرُ عَلَى "+esc(state.teams[state.active]):"هَلْ أَنْتَ مُسْتَعِدٌّ؟";
        const text=state.phase==="spinning"?"سَتَتَوَقَّفُ الْعَجَلَةُ عِنْدَ سُؤَالٍ جَدِيدٍ.":"الْمَسْ زِرَّ الْعَجَلَةِ، ثُمَّ اخْتَرِ الْإِجَابَةَ الصَّحِيحَةَ.";
        return '<div class="ready-panel"><div class="lamp">✦</div><p class="eyebrow">الْجَوْلَةُ '+(state.history.length+1)+' مِنْ '+TERMS.length+'</p><h2>'+title+'</h2><p>'+text+'</p>'+(state.phase==="ready"?'<div class="gesture"><b>👆</b> الْمَسْ وَسَطَ الْعَجَلَةِ لِتَبْدَأَ</div>':'')+'</div>';
      }
      const t=TERMS[state.current],locked=state.feedback&&state.feedback.type!=="retry";
      const opts=state.options.map((m,i)=>'<button class="option '+(locked&&m===t.m?"correct":"")+'" data-act="answer" data-index="'+i+'" '+(locked?"disabled":"")+'><span class="letter">'+["أ","ب","ج","د"][i]+'</span><span>'+esc(m)+'</span>'+(locked&&m===t.m?'<span>✓</span>':'')+'</button>').join("");
      const timer=state.timer?'<div id="timer" class="timer '+(state.time<=6?"urgent":"")+'">⏱️ <b id="timeNum">'+state.time+'</b><small>ثَانِيَةً</small><i><em id="timeBar" style="width:'+((state.time/LEVELS[state.level].seconds)*100)+'%"></em></i></div>':'';
      let feedback="";
      if(state.feedback){
        const f=state.feedback,klass=f.type==="correct"?"correct":f.type==="retry"?"retry":"wrong",icon=f.type==="correct"?"✅":f.type==="retry"?"💡":"✖";
        feedback='<div class="feedback '+klass+'"><span class="big">'+icon+'</span><div><strong>'+f.msg+'</strong>'+(locked?'<span>الْإِجَابَةُ الصَّحِيحَةُ: '+esc(t.m)+'</span>':'')+'</div>'+(locked?'<button class="next" data-act="next">الْجَوْلَةُ التَّالِيَةُ ❮</button>':'')+'</div>';
      }
      const hint=(!locked&&state.level!=="challenge"&&t.h)?'<div class="hint-row"><button class="hint-btn" data-act="hint" '+(state.hint?"disabled":"")+'>💡 '+(state.hint?"ظَهَرَ التَّلْمِيحُ":"أَرِنِي تَلْمِيحًا")+'</button>'+(state.hint?'<p class="hint-text">💡 '+esc(t.h)+'</p>':'')+'</div>':'';
      return '<div class="qtop"><span class="round">السُّؤَالُ '+(state.history.length+1)+'</span>'+timer+'</div><div class="word"><span>'+esc(CONFIG.questionPrompt||"اخْتَرِ الْإِجَابَةَ الصَّحِيحَةَ:")+'</span><div><h2>'+esc(t.w)+'</h2><button class="speak" data-act="speak" aria-label="اسْتَمِعْ إِلَى السُّؤَالِ">🔊</button></div></div><div class="options">'+opts+'</div>'+hint+feedback;
    }

    function renderGame(){
      applyConfig();const progress=Math.round(state.used.length/Math.max(1,TERMS.length)*100);
      app.innerHTML='<main class="shell game"><div class="pattern"></div><header class="topbar"><div class="mini-brand">'+logo("mini-logo")+'<div><strong>'+esc(CONFIG.gameIcon)+' '+esc(CONFIG.gameName)+'</strong>'+(CONFIG.showSchool&&CONFIG.schoolName?'<span>'+esc(CONFIG.schoolName)+'</span>':'')+'</div></div><div class="progress"><div class="prog-label"><span>التَّقَدُّمُ</span><strong>'+state.used.length+' مِنْ '+TERMS.length+'</strong></div><div class="track"><i style="width:'+progress+'%"></i></div></div><div class="tools">'+(CONFIG.showAdmin?'<button class="icon-btn" data-act="admin" title="لَوْحَةُ التَّحَكُّمِ">⚙️</button>':'')+'<button class="icon-btn" data-act="sound" title="الصوت">'+(state.sound?"🔊":"🔇")+'</button><button class="icon-btn" data-act="fullscreen" title="ملء الشاشة">⛶</button><button class="icon-btn" data-act="setup" title="الإعدادات">↻</button></div></header><section class="scorebar">'+scoreHTML()+'</section><section class="play">'+wheelHTML()+'<div class="panel" aria-live="polite">'+panelHTML()+'</div></section><footer class="footer">'+(CONFIG.showTeacher&&CONFIG.teacherName?'<span>إِعْدَادُ: أ/ '+esc(CONFIG.teacherName)+'</span>':'<span></span>')+'<b>الْمُسْتَوَى: '+LEVELS[state.level].icon+' '+LEVELS[state.level].label+'</b></footer></main>';
    }

    function renderResults(){
      const correct=state.history.filter(x=>x.correct).length,pct=Math.round(correct/TERMS.length*100),stars=pct>=88?3:pct>=63?2:1;
      const winner=state.scores[0]===state.scores[1]?-1:state.scores[0]>state.scores[1]?0:1;
      const title=state.mode==="solo"?"أَحْسَنْتَ! أَتْمَمْتَ "+esc(CONFIG.gameName):winner<0?"تَعَادُلٌ رَائِعٌ بَيْنَ الْفَرِيقَيْنِ!":"الْفَائِزُ: "+esc(state.teams[winner]);
      const score=state.mode==="solo"?'<div class="stat"><span>🏅</span><b>'+state.scores[0]+'</b><small>مَجْمُوعُ النِّقَاطِ</small></div>':'<div class="team-result '+(winner===0?"win":"")+'"><span>'+esc(state.teams[0])+'</span><b>'+state.scores[0]+'</b><small>نُقْطَةً</small></div><div class="team-result '+(winner===1?"win":"")+'"><span>'+esc(state.teams[1])+'</span><b>'+state.scores[1]+'</b><small>نُقْطَةً</small></div>';
      const review=state.history.map(x=>'<article class="'+(x.correct?"":"bad")+'"><span>'+(x.correct?"✅":"❌")+'</span><div><b>'+esc(TERMS[x.term].w)+'</b><p>'+esc(TERMS[x.term].m)+'</p></div></article>').join("");
      app.innerHTML='<main class="shell results"><div class="pattern"></div><div class="corner"></div><section class="card result-card">'+logo()+'<div class="trophy">🏆</div><p class="eyebrow" style="margin-top:12px">اكْتَمَلَ التَّحَدِّي</p><h1>'+title+'</h1><div class="stars">'+[0,1,2].map(i=>'<span class="'+(i<stars?"on":"")+'">★</span>').join("")+'</div><div class="stats">'+score+'<div class="stat"><span>✅</span><b>'+correct+' / '+TERMS.length+'</b><small>إِجَابَاتٌ مُتْقَنَةٌ</small></div><div class="stat"><span>👑</span><b>×'+state.best+'</b><small>أَفْضَلُ سِلْسِلَةٍ</small></div></div><div class="master"><div><span>نِسْبَةُ الْإِتْقَانِ</span><b>'+pct+'%</b></div><div class="master-track"><i style="width:'+pct+'%"></i></div></div><details class="review"><summary>📖 مُرَاجَعَةُ الْأَسْئِلَةِ</summary><div class="review-grid">'+review+'</div></details><div class="actions"><button class="secondary" data-act="setup">↻ تَغْيِيرُ الْإِعْدَادَاتِ</button><button class="primary" data-act="restart">✨ الْعَبْ مِنْ جَدِيدٍ</button></div>'+(CONFIG.showTeacher&&CONFIG.teacherName?'<p class="credit">إِعْدَادُ: أ/ '+esc(CONFIG.teacherName)+'</p>':'')+'</section></main>';
    }
    function render(){applyConfig();state.screen==="admin"?renderAdmin():state.screen==="setup"?renderSetup():state.screen==="results"?renderResults():renderGame()}

    function start(){
      const questions=validQuestions();if(questions.length<2){notify("أَضِفْ سُؤَالَيْنِ صَحِيحَيْنِ عَلَى الْأَقَلِّ لِبَدْءِ اللُّعْبَةِ.",true);return}CONFIG.questions=questions;TERMS=CONFIG.questions;
      clickSound();clearInterval(state.timerId);Object.assign(state,{screen:"game",phase:"ready",scores:[0,0],active:0,used:[],current:null,options:[],rotation:0,attempts:0,hint:false,hintUsed:false,feedback:null,history:[],streak:0,best:0,time:LEVELS[state.level].seconds,timerId:null});render()
    }
    function makeOptions(index){const wrong=shuffle([...new Set(TERMS.filter((_,i)=>i!==index).map(x=>x.m))]).slice(0,Math.min(LEVELS[state.level].count,TERMS.length)-1);return shuffle([TERMS[index].m,...wrong])}
    function spin(){
      if(state.phase!=="ready")return;
      const remaining=TERMS.map((_,i)=>i).filter(i=>!state.used.includes(i));if(!remaining.length){finish();return}
      clickSound();spinSound();const picked=remaining[Math.floor(Math.random()*remaining.length)],step=360/TERMS.length,old=state.rotation,norm=((old%360)+360)%360,desired=(360-picked*step)%360,target=old+5*360+(desired-norm+360)%360;
      state.phase="spinning";state.feedback=null;state.hint=false;state.hintUsed=false;state.attempts=0;render();
      requestAnimationFrame(()=>requestAnimationFrame(()=>{const wheel=document.getElementById("wheel");if(wheel)wheel.style.transform="rotate("+target+"deg)"}));
      setTimeout(()=>{state.rotation=target;state.current=picked;state.options=makeOptions(picked);state.time=LEVELS[state.level].seconds;state.phase="question";tone(880,.18,"sine",.07);tone(1175,.24,"sine",.055,.1);render();startTimer()},3260)
    }
    function startTimer(){clearInterval(state.timerId);if(!state.timer)return;state.timerId=setInterval(()=>{if(state.phase!=="question"||(state.feedback&&state.feedback.type!=="retry"))return;state.time--;updateTimer();if(state.time<=6&&state.time>0)tone(420,.055,"sine",.025);if(state.time<=0){clearInterval(state.timerId);lock(false,state.attempts+1,true)}},1000)}
    function updateTimer(){const n=document.getElementById("timeNum"),bar=document.getElementById("timeBar"),box=document.getElementById("timer");if(n)n.textContent=state.time;if(bar)bar.style.width=(state.time/LEVELS[state.level].seconds*100)+"%";if(box)box.classList.toggle("urgent",state.time<=6)}
    function answer(i){
      if(state.phase!=="question"||(state.feedback&&state.feedback.type!=="retry"))return;clickSound();
      const correct=state.options[i]===TERMS[state.current].m;if(correct){lock(true,state.attempts);return}
      if(state.attempts===0&&state.level!=="challenge"){state.attempts=1;state.feedback={type:"retry",msg:"مُحَاوَلَةٌ جَيِّدَةٌ! فَكِّرْ مَرَّةً أُخْرَى."};wrongSound();render();setTimeout(()=>{if(state.feedback&&state.feedback.type==="retry"){state.feedback=null;render()}},1350);return}
      lock(false,state.attempts+1,false)
    }
    function lock(correct,attempts,timeout=false){
      if(state.phase!=="question"||state.current===null)return;clearInterval(state.timerId);state.history.push({term:state.current,correct,attempts,team:state.active});
      if(correct){state.streak++;state.best=Math.max(state.best,state.streak);const timeBonus=state.timer?Math.max(0,state.time*2):20,attemptScore=attempts===0?100:65,hintPenalty=state.hintUsed?20:0,streakBonus=state.streak>=3?25:0,points=Math.max(40,attemptScore+timeBonus+streakBonus-hintPenalty);state.scores[state.active]+=points;state.feedback={type:"correct",msg:state.streak>=3?"رَائِعٌ! سِلْسِلَةُ تَفَوُّقٍ ×"+state.streak:"إِجَابَةٌ صَحِيحَةٌ وَمُتْقَنَةٌ!"};correctSound();confetti()}
      else{state.streak=0;state.feedback={type:timeout?"timeout":"wrong",msg:timeout?"انْتَهَى الْوَقْتُ، لِنَتَعَلَّمِ الْمَعْنَى الصَّحِيحَ.":"لَا بَأْسَ، إِلَيْكَ الْمَعْنَى الصَّحِيحَ."};wrongSound()}
      render()
    }
    function next(){
      clickSound();state.used.push(state.current);state.current=null;state.options=[];state.feedback=null;state.attempts=0;state.hint=false;state.hintUsed=false;if(state.mode==="teams")state.active=state.active?0:1;if(state.used.length>=TERMS.length)finish();else{state.phase="ready";render()}
    }
    function finish(){clearInterval(state.timerId);state.screen="results";state.phase="results";fanfare();render();confetti(true)}
    function speak(){clickSound();if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(TERMS[state.current].w),v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith("ar"));if(v)u.voice=v;u.lang="ar-QA";u.rate=.76;u.pitch=1;u.volume=state.sound?1:0;speechSynthesis.speak(u)}
    async function fullscreen(){
      clickSound();const root=document.documentElement,request=root.requestFullscreen||root.webkitRequestFullscreen,exit=document.exitFullscreen||document.webkitExitFullscreen;
      try{if(request&&!document.fullscreenElement&&!document.webkitFullscreenElement){await request.call(root);return}if(exit&&(document.fullscreenElement||document.webkitFullscreenElement)){await exit.call(document);return}}catch(e){}
      document.body.classList.toggle("focus-mode");syncViewport();notify(document.body.classList.contains("focus-mode")?"تَمَّ تَفْعِيلُ وَضْعِ الشَّاشَةِ الْكَامِلَةِ.":"تَمَّ إِنْهَاءُ وَضْعِ الشَّاشَةِ الْكَامِلَةِ.")
    }
    function setup(){clickSound();clearInterval(state.timerId);try{speechSynthesis.cancel()}catch(e){}state.screen="setup";state.phase="ready";render()}

    document.addEventListener("click",e=>{
      const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
      if(a==="mode"){clickSound();state.mode=b.dataset.val;render()}
      else if(a==="level"){clickSound();state.level=b.dataset.val;state.time=LEVELS[state.level].seconds;render()}
      else if(a==="timer"){clickSound();state.timer=!state.timer;render()}
      else if(a==="sound"){state.sound=!state.sound;render()}
      else if(a==="how"){clickSound();state.showHow=!state.showHow;render()}
      else if(a==="start"||a==="restart")start();
      else if(a==="spin")spin();
      else if(a==="answer")answer(Number(b.dataset.index));
      else if(a==="hint"){clickSound();state.hint=true;state.hintUsed=true;render()}
      else if(a==="next")next();
      else if(a==="speak")speak();
      else if(a==="fullscreen")fullscreen();
      else if(a==="setup")setup();
      else if(a==="admin"){clickSound();clearInterval(state.timerId);state.screen="admin";state.phase="ready";renderAdmin()}
      else if(a==="backSetup"){clickSound();state.screen="setup";render()}
      else if(a==="theme"){clickSound();CONFIG.background=b.dataset.val;applyConfig();renderAdmin()}
      else if(a==="exportjson")exportJSON();
      else if(a==="exporthtml")exportHTML();
      else if(a==="importjson")document.getElementById("jsonFile")?.click();
      else if(a==="samplejson"){
        const sample={gameName:"اسْمُ لُعْبَتِي",teacherName:"اسْمُ الْمُعَلِّمِ",questionPrompt:"اخْتَرِ الْإِجَابَةَ الصَّحِيحَةَ:",questions:[{w:"السُّؤَالُ الْأَوَّلُ",s:"١",m:"الْإِجَابَةُ الصَّحِيحَةُ",h:"تَلْمِيحٌ اخْتِيَارِيٌّ"},{w:"السُّؤَالُ الثَّانِي",s:"٢",m:"إِجَابَةٌ أُخْرَى",h:""}]};
        downloadFile(JSON.stringify(sample,null,2),"نموذج-استيراد-الأسئلة.json","application/json;charset=utf-8");notify("تَمَّ تَنْزِيلُ نَمُوذَجِ الِاسْتِيرَادِ.")
      }
      else if(a==="addq"){CONFIG.questions.push({w:"",s:String(CONFIG.questions.length+1),m:"",h:""});TERMS=CONFIG.questions;renderAdmin();setTimeout(()=>document.querySelector(".q-edit:last-child textarea")?.focus(),0)}
      else if(a==="deleteq"){const i=Number(b.dataset.index);CONFIG.questions.splice(i,1);TERMS=CONFIG.questions;renderAdmin()}
      else if(a==="duplicateq"){const i=Number(b.dataset.index);CONFIG.questions.splice(i+1,0,clone(normalizeQuestion(CONFIG.questions[i])));TERMS=CONFIG.questions;renderAdmin()}
      else if(a==="moveq"){
        const i=Number(b.dataset.index),j=i+Number(b.dataset.dir);if(j>=0&&j<CONFIG.questions.length){[CONFIG.questions[i],CONFIG.questions[j]]=[CONFIG.questions[j],CONFIG.questions[i]];TERMS=CONFIG.questions;renderAdmin()}
      }
      else if(a==="clearq"){if(confirm("هَلْ تُرِيدُ حَذْفَ جَمِيعِ الْأَسْئِلَةِ؟")){CONFIG.questions=[];TERMS=CONFIG.questions;renderAdmin()}}
      else if(a==="resetall"){if(confirm("هَلْ تُرِيدُ اسْتِعَادَةَ اللُّعْبَةِ الْأَصْلِيَّةِ بِكُلِّ إِعْدَادَاتِهَا؟")){CONFIG=clone(BASE_CONFIG);TERMS=CONFIG.questions;state.exportEditable=false;applyConfig();renderAdmin();notify("تَمَّتِ اسْتِعَادَةُ الْإِعْدَادَاتِ الْأَصْلِيَّةِ.")}}
    });
    document.addEventListener("input",e=>{
      const k=e.target.dataset.input;if(k==="solo")state.solo=e.target.value;if(k==="team0")state.teams[0]=e.target.value;if(k==="team1")state.teams[1]=e.target.value;
      const cfg=e.target.dataset.cfg;if(cfg){CONFIG[cfg]=e.target.value;applyConfig()}
      if(e.target.dataset.q!==undefined){const i=Number(e.target.dataset.q),field=e.target.dataset.field;if(CONFIG.questions[i]&&["w","s","m","h"].includes(field)){CONFIG.questions[i][field]=e.target.value;TERMS=CONFIG.questions}}
    });
    document.addEventListener("change",e=>{
      const bool=e.target.dataset.bool;if(bool){CONFIG[bool]=e.target.checked;applyConfig();renderAdmin();return}
      const stateKey=e.target.dataset.state;if(stateKey){state[stateKey]=e.target.checked;return}
      if(e.target.id==="jsonFile"){importJSONFile(e.target.files?.[0]);e.target.value=""}
    });
    document.addEventListener("visibilitychange",()=>{if(document.hidden)clearInterval(state.timerId);else if(state.screen==="game"&&state.phase==="question"&&state.timer&&!(state.feedback&&state.feedback.type!=="retry"))startTimer()});
    addEventListener("fullscreenchange",()=>{if(document.fullscreenElement)document.body.classList.remove("focus-mode")});
    document.addEventListener("keydown",e=>{if((e.code==="Space"||e.code==="Enter")&&state.screen==="game"&&state.phase==="ready"){e.preventDefault();spin()}if(state.screen==="game"&&state.phase==="question"&&["1","2","3","4"].includes(e.key))answer(Number(e.key)-1)});
    render();
  })();
  </script>
</body>
</html>
