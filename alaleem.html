  <style>

    .wheel-label{width:30%;position:absolute;top:50%;left:50%;z-index:3;display:grid;place-items:center;gap:2px;transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(var(--wheel)*-.34)) rotate(var(--u));color:#fff;font-size:clamp(10px,.86vw,15px);font-weight:900;line-height:1.35;text-align:center;text-shadow:0 2px 4px #0008}

    .ready-panel{margin:auto;max-width:650px;display:grid;place-items:center;text-align:center}.lamp{width:clamp(82px,8vw,112px);height:clamp(82px,8vw,112px);margin-bottom:14px;border:2px solid #d8a83e99;border-radius:50% 50% 42% 42%;display:grid;place-items:center;background:radial-gradient(circle,#fff4bd,#f1d171 60%,#c9952d);font-size:40px;box-shadow:0 0 45px #d8a83e55;animation:float 2.8s infinite}

d-template-columns:auto 1fr;gap:8px;background:#f4faf7}.review article.bad{background:#fff1f2}.review article b{color:var(--teal2);font-size:12px}.review article p{margin:2px 0 0;color:var(--soft);font-size:10px;font-weight:800;line-height:1.5}

  <div id="app"><main class="shell admin"><section class="admin-card"><div class="admin-head"><div><p class="eyebrow">نُسْخَةُ التَّحَكُّمِ الْكَامِلِ</p><h1>⚙️ لَوْحَةُ التَّحَكُّمِ</h1></div><button class="secondary" data-act="setup">مُعَايَنَةُ اللُّعْبَةِ ❮</button></div><div class="admin-grid"><label>عُنْوَانُ اللُّعْبَةِ<input data-config="title" value="القرص الدوّار — اسم الله العليم"></label><label>اسْمُ الدَّرْسِ<input data-config="lesson" value="اسم الله العليم"></label><label>اسْمُ الْمَدْرَسَةِ<input data-config="school" value="مدرسة عبد الله بن زيد آل محمود النموذجية للبنين"></label><label>اسْمُ الْمُعِدِّ<input data-config="author" value="معلمات الصف الثالث"></label></div><div class="terms-editor"><article class="term-edit"><h3>السُّؤَالُ 1</h3><button class="danger" data-act="delete-term" data-index="0">حَذْفٌ</button><label class="wide">نَصُّ السُّؤَالِ<textarea data-term="q" data-index="0">مَا مَعْنَى اسْمِ اللَّهِ الْعَلِيمْ؟</textarea></label><label>نَصُّهُ عَلَى الْعَجَلَةِ<input data-term="s" data-index="0" value="مَعْنَى الْعَلِيم"></label><label>الْهَدَفُ<input data-term="g" data-index="0" value="مَعْنَى الِاسْم"></label><label>الصُّورَةُ التَّوْضِيحِيَّةُ<select data-term="i" data-index="0"><option value="knowledge" selected="">التعلّم والمعرفة</option><option value="nature">مظاهر علم الله</option><option value="time">الماضي والحاضر والمستقبل</option><option value="actions">أقوالي وأفعالي</option><option value="truth">صح أم خطأ</option></select></label><label>الْخِيَارُ 1<input data-term="o0" data-index="0" value="الَّذِي يَعْلَمُ كُلَّ شَيْءْ."></label><label>الْخِيَارُ 2<input data-term="o1" data-index="0" value="الَّذِي يَخْلُقُ جَمِيعَ الْمَخْلُوقَاتْ."></label><label>الْخِيَارُ 3<input data-term="o2" data-index="0" value="الَّذِي يَرْزُقُ جَمِيعَ الْمَخْلُوقَاتْ."></label><label>الْخِيَارُ 4<input data-term="o3" data-index="0" value="الَّذِي يَغْفِرُ الذُّنُوبْ."></label><label>رَقْمُ الْإِجَابَةِ الصَّحِيحَةِ<select data-term="a" data-i     function wheelHTML(rotation=state.rotation){

      const labels=TERMS.map((t,i)=>'<span class="wheel-label '+(state.used.includes(i)?"used":"")+'" style="--a:'+(i*slice)+'deg;--u:'+(-i*slice-rotation)+'deg"><b>'+(i+1)+'</b>'+esc(t.s)+'</span>').join("");

      const marker=/const EXPORTED=[^\n]*;/;
       if(!marker.test(html)){alert('تَعَذَّرَ إِنْشَاءُ نُسْخَةِ اللَّعِبِ.');return}
       html=html.replace(marker,'const EXPORTED='+cfg+';');
      downloadFile('القرص-الدوار-اسم-الله-العليم.html',html,'text/html;charset=utf-8');
    }
    function render(){
      document.title=GAME.title+" | "+GAME.school;state.screen==="setup"?renderSetup():state.screen==="results"?renderResults():state.screen==="admin"?renderAdmin():renderGame();
      document.querySelectorAll('.credit').forEach(x=>x.textContent='إِعْدَادُ: '+GAME.author);
      if(state.screen==="results"){const s=document.querySelector('.review summary');if(s)s.textContent='📖 مُرَاجَعَةُ أَسْئِلَةِ '+GAME.lesson}
    }

    function start(){
      clearRoundWork();clickSound();Object.assign(state,{screen:"game",phase:"ready",scores:[0,0],active:0,used:[],current:null,options:[],rotation:0,attempts:0,hint:false,hintUsed:false,feedback:null,history:[],streak:0,best:0,time:LEVELS[state.level].seconds,timerId:null});render()
    }
    function makeOptions(index){const t=TERMS[index],correct=t.o[t.a],wrong=shuffle(t.o.filter((_,i)=>i!==Number(t.a))).slice(0,LEVELS[state.level].count-1);return shuffle([correct,...wrong])}
    function spin(){
      if(state.phase!=="ready")return;
      const remaining=TERMS.map((_,i)=>i).filter(i=>!state.used.includes(i));if(!remaining.length){finish();return}
      clearRoundWork();const epoch=roundEpoch;clickSound();spinSound();const picked=remaining[Math.floor(Math.random()*remaining.length)],old=state.rotation,norm=((old%360)+360)%360,slice=360/TERMS.length,desired=(360-picked*slice)%360,target=old+5*360+(desired-norm+360)%360;
      state.phase="spinning";state.feedback=null;state.hint=false;state.hintUsed=false;state.attempts=0;render();
      requestAnimationFrame(()=>requestAnimationFrame(()=>{const wheel=document.getElementById("wheel");if(wheel)wheel.style.transform="rotate("+target+"deg)"}));
      spinTimer=setTimeout(()=>{if(epoch!==roundEpoch||state.screen!=="game"||state.phase!=="spinning")return;state.rotation=target;state.current=picked;state.options=makeOptions(picked);state.time=LEVELS[state.level].seconds;state.phase="question";tone(880,.18,"sine",.07);tone(1175,.24,"sine",.055,.1);render();startTimer()},3260)
    }
    function startTimer(){clearInterval(state.timerId);if(!state.timer)return;state.timerId=setInterval(()=>{if(state.phase!=="question"||(state.feedback&&state.feedback.type!=="retry"))return;state.time--;updateTimer();if(state.time<=6&&state.time>0)tone(420,.055,"sine",.025);if(state.time<=0){clearInterval(state.timerId);lock(false,state.attempts+1,true)}},1000)}
    function updateTimer(){const n=document.getElementById("timeNum"),bar=document.getElementById("timeBar"),box=document.getElementById("timer");if(n)n.textContent=state.time;if(bar)bar.style.width=(state.time/LEVELS[state.level].seconds*100)+"%";if(box)box.classList.toggle("urgent",state.time<=6)}
    function answer(i){
      if(state.phase!=="question"||!Number.isInteger(i)||i<0||i>=state.options.length||(state.feedback&&state.feedback.type!=="retry"))return;clickSound();
      const t=TERMS[state.current],correct=state.options[i]===t.o[t.a];if(correct){lock(true,state.attempts);return}
      if(state.attempts===0&&state.level!=="challenge"){state.attempts=1;state.feedback={type:"retry",msg:"تَذَكَّرْ مَعْنَى اسْمِ اللَّهِ الْعَلِيمْ، وَحَاوِلْ مَرَّةً أُخْرَى!"};wrongSound();render();retryTimer=setTimeout(()=>{if(state.feedback&&state.feedback.type==="retry"){state.feedback=null;render()}},1350);return}
      lock(false,state.attempts+1,false)
    }
    function lock(correct,attempts,timeout=false){
      if(state.phase!=="question"||state.current===null||(state.feedback&&state.feedback.type!=="retry"))return;clearTimeout(retryTimer);clearInterval(state.timerId);stopHumanVoice();const epoch=roundEpoch,answerText=TERMS[state.current].o[TERMS[state.current].a];state.history.push({term:state.current,correct,attempts,team:state.active});
      if(correct){state.streak++;state.best=Math.max(state.best,state.streak);const timeBonus=state.timer?Math.max(0,state.time*2):20,attemptScore=attempts===0?100:65,hintPenalty=state.hintUsed?20:0,streakBonus=state.streak>=3?25:0,points=Math.max(40,attemptScore+timeBonus+streakBonus-hintPenalty),phrase=encouragement();state.scores[state.active]+=points;state.feedback={type:"correct",msg:phrase};correctSound();confetti(state.streak>=3);render();showCelebration(phrase,points,state.streak);humanTimer=setTimeout(()=>{if(epoch===roundEpoch&&state.screen==="game")googleSpeak(phrase)},380)}
      else{state.streak=0;state.feedback={type:timeout?"timeout":"wrong",msg:timeout?"انْتَهَى الْوَقْتُ، لِنَتَعَلَّمِ الْإِجَابَةَ الصَّحِيحَةَ.":"لَا بَأْسْ، تَأَمَّلِ الْإِجَابَةَ الصَّحِيحَةْ!"};wrongSound();humanTimer=setTimeout(()=>{if(epoch===roundEpoch&&state.screen==="game")googleSpeak((timeout?"انْتَهَى الْوَقْتْ. ":"لَا بَأْسْ. ")+"الْإِجَابَةُ الصَّحِيحَةُ هِيَ: "+answerText)},520)}
      const completedTerm=state.current;
      if(!correct)render();
      const feedbackText=answerText+" "+(TERMS[state.current].e||"");const readingDelay=Math.max(5200,Math.min(13500,feedbackText.split(/\s+/).length*340));advanceTimer=setTimeout(()=>{if(epoch===roundEpoch&&state.phase==="question"&&state.current===completedTerm&&state.feedback&&state.feedback.type!=="retry")next()},readingDelay)
    }
    function next(){
      if(state.screen!=="game"||state.phase!=="question"||state.current===null||!state.feedback||state.feedback.type==="retry")return;clearRoundWork();clickSound();state.used.push(state.current);state.current=null;state.options=[];state.feedback=null;state.attempts=0;state.hint=false;state.hintUsed=false;if(state.mode==="teams")state.active=state.active?0:1;if(state.used.length>=TERMS.length)finish();else{state.phase="ready";render()}
    }
    function finish(){clearInterval(state.timerId);state.screen="results";state.phase="results";fanfare();render();confetti(true)}
    function speak(){if(!state.voice||state.current===null)return;clickSound();googleSpeak(TERMS[state.current].q)}
    async function fullscreen(){clickSound();try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}}
    function setup(){clearRoundWork();clickSound();state.screen="setup";state.phase="ready";render()}

    document.addEventListener("click",e=>{
      const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
      if(a==="mode"){clickSound();state.mode=b.dataset.val;render()}
      else if(a==="level"){clickSound();state.level=b.dataset.val;state.time=LEVELS[state.level].seconds;render()}
      else if(a==="timer"){clickSound();state.timer=!state.timer;render()}
      else if(a==="voice"){state.voice=!state.voice;if(!state.voice)stopHumanVoice();clickSound();render()}
      else if(a==="effects"){state.effects=!state.effects;if(audio&&effectsBus){effectsBus.gain.setValueAtTime(state.effects?1:0,audio.currentTime)}clickSound();render()}
      else if(a==="how"){clickSound();state.showHow=!state.showHow;render()}
      else if(a==="start"||a==="restart")start();
      else if(a==="spin")spin();
      else if(a==="answer")answer(Number(b.dataset.index));
      else if(a==="hint"){clickSound();state.hint=true;state.hintUsed=true;render()}
      else if(a==="next")next();
      else if(a==="speak")speak();
      else if(a==="fullscreen")fullscreen();
      else if(a==="setup")setup();
      else if(a==="admin"){clickSound();state.screen="admin";render()}
      else if(a==="add-term"){const n=TERMS.length+1;TERMS.push({q:"اُكْتُبْ نَصَّ السُّؤَالِ الْجَدِيدِ.",s:"السُّؤَالُ "+n,o:["الْخِيَارُ الْأَوَّلُ","الْخِيَارُ الثَّانِي","الْخِيَارُ الثَّالِثُ","الْخِيَارُ الرَّابِعُ"],a:0,h:"اُكْتُبْ تَلْمِيحًا مُنَاسِبًا.",i:"knowledge",g:"مَعْلُومَةٌ جَدِيدَةٌ"});render()}
      else if(a==="delete-term"){if(TERMS.length<=2){alert("يَجِبُ أَنْ يَبْقَى سُؤَالَانِ عَلَى الْأَقَلّْ.");return}TERMS.splice(Number(b.dataset.index),1);render()}
      else if(a==="export-json")exportJSON();
      else if(a==="export-play")exportPlay();
    });
    function updateEditable(target){const k=target.dataset.input;if(k==="solo")state.solo=target.value;if(k==="team0")state.teams[0]=target.value;if(k==="team1")state.teams[1]=target.value;const c=target.dataset.config;if(c)GAME[c]=target.value;const f=target.dataset.term,i=Number(target.dataset.index);if(f&&TERMS[i]){if(/^o[0-3]$/.test(f))TERMS[i].o[Number(f.slice(1))]=target.value;else if(f==="a")TERMS[i].a=Number(target.value);else TERMS[i][f]=target.value}}
    document.addEventListener("input",e=>updateEditable(e.target));
    document.addEventListener("change",e=>{updateEditable(e.target);if(e.target.id!=="jsonImport"||!e.target.files[0])return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data.game||!Array.isArray(data.terms)||data.terms.length<2||data.terms.some(t=>!t.q||!Array.isArray(t.o)||(t.o.length<2||t.o.length>4)||!Number.isInteger(Number(t.a))||Number(t.a)<0||Number(t.a)>=t.o.length))throw 0;Object.assign(GAME,data.game);TERMS=data.terms.map(t=>({...t,a:Number(t.a)}));render();alert("تَمَّ اسْتِيرَادُ الْبَيَانَاتِ بِنَجَاحٍ.")}catch(_){alert("مِلَفُّ الْبَيَانَاتِ غَيْرُ صَحِيحٍ.")}};reader.readAsText(e.target.files[0])});
    document.addEventListener("keydown",e=>{if((e.code==="Space"||e.code==="Enter")&&state.screen==="game"&&state.phase==="ready"){e.preventDefault();spin()}if(state.screen==="game"&&state.phase==="question"&&["1","2","3","4"].includes(e.key))answer(Number(e.key)-1)});
    render();
  })();
  </script>
