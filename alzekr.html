function panelHTML(){if(state.phase==="ready"||state.phase==="spinning"){return '<div class="ready-panel"><div class="ready-icon">'+(state.phase==="spinning"?"💫":"✨")+'</div><p class="eyebrow">الْجَوْلَةُ '+(state.history.length+1)+' مِنْ '+QUESTIONS.length+'</p><h2>'+(state.phase==="spinning"?"تَرَقَّبِ السُّؤَالَ...":state.mode==="teams"?"الدَّوْرُ عَلَى "+esc(state.teams[state.active]):"هَلْ أَنْتَ مُسْتَعِدٌّ؟")+'</h2><p>أَدِرِ الْعَجَلَةَ، وَاخْتَرِ الْإِجَابَةَ الصَّحِيحَةَ فِي تَحَدِّي الذِّكْرِ.</p>'+(state.phase==="ready"?'<div class="gesture">👆 الْمَسْ وَسَطَ الْعَجَلَةِ</div>':"")+'</div>'}
const q=QUESTIONS[state.current],locked=!!state.feedback&&state.feedback.type!=="retry";const opts=q.options.map((o,i)=>'<button class="option '+(locked&&i===q.answer?"correct":"")+' '+(locked&&state.selected===i&&i!==q.answer?"chosen-wrong":"")+'" data-act="answer" data-index="'+i+'" '+(locked?"disabled":"")+'><span class="letter">'+(q.type==="tf"?(i===0?"✓":"✕"): ["أ","ب","ج","د"][i])+'</span><span>'+esc(o)+'</span>'+(locked&&i===q.answer?'<span>✓</span>':"")+'</button>').join("");const timer=state.timer?'<div class="timer '+(state.time<=6?"urgent":"")+'">⏱️ <span id="timeNum">'+state.time+'</span> ثَانِيَةً</div>':"";let feedback="";if(state.feedback){const f=state.feedback;feedback='<div class="feedback '+f.type+'"><span class="big">'+(f.type==="correct"?"✅":f.type==="retry"?"💡":"❌")+'</span><div><strong>'+esc(f.msg)+'</strong>'+(locked?'<small>الْإِجَابَةُ الصَّحِيحَةُ: '+esc(q.options[q.answer])+'</small>':"")+'</div>'+(locked?'<button class="next" data-act="next">الْجَوْلَةُ التَّالِيَةُ ❮</button>':"")+'</div>'}return '<div class="qtop"><span class="round">السُّؤَالُ '+(state.history.length+1)+'</span><span class="qtype">'+typeName(q.type)+'</span>'+timer+'</div><div class="question-box"><h2>'+esc(q.prompt)+'</h2>'+visual(q.visual)+'<button class="speak" data-act="speak" title="استمع إلى السؤال">🔊</button></div><div class="options '+(q.type==="tf"?"tf-options":"")+'">'+opts+'</div>'+(!locked?'<button class="switch-btn" style="margin-top:10px" data-act="hint">💡 تَلْمِيحٌ</button>':"")+feedback}
function popHTML(){return state.pop?'<div class="encourage-pop"><div class="encourage-card '+(state.pop.good?"":"bad")+'"><div class="emoji">'+(state.pop.good?"🌟":"💡")+'</div><h2>'+esc(state.pop.text)+'</h2></div></div>':""}
function gameHTML(){const p=Math.round(state.used.length/QUESTIONS.length*100);return '<main class="shell game"><div class="pattern"></div><header class="topbar"><div class="mini-brand"><strong>'+esc(GAME.title)+'</strong><span>'+esc(GAME.lesson)+' · '+esc(GAME.school)+'</span></div><div class="progress"><div class="prog-label"><span>التَّقَدُّمُ</span><strong>'+state.used.length+' مِنْ '+QUESTIONS.length+'</strong></div><div class="track"><i style="width:'+p+'%"></i></div></div><div class="tools"><button class="icon-btn" data-act="sound">'+(state.sound?"🔊":"🔇")+'</button><button class="icon-btn" data-act="fullscreen">⛶</button><button class="icon-btn" data-act="setup">↻</button></div></header><section class="scorebar">'+scoreHTML()+'</section><section class="play">'+wheelHTML()+'<div class="panel" aria-live="polite">'+panelHTML()+'</div></section><footer class="footer"><span>إِعْدَادُ: '+esc(GAME.author)+'</span><b>'+esc(GAME.school)+'</b></footer>'+popHTML()+'</main>'}
function resultsHTML(){const c=state.history.filter(x=>x.correct).length,pct=Math.round(c/QUESTIONS.length*100),stars=pct>=85?3:pct>=60?2:1,review=state.history.map(x=>'<div class="review-item '+(x.correct?"":"bad")+'">'+(x.correct?"✅":"❌")+' <b>'+esc(QUESTIONS[x.q].label)+'</b><br><small>'+esc(QUESTIONS[x.q].options[QUESTIONS[x.q].answer])+'</small></div>').join("");return '<main class="shell results"><div class="pattern"></div><section class="card"><div class="trophy">🏆</div><p class="school">'+esc(GAME.school)+'</p><div class="brand"><h1>أَحْسَنْتُمْ، اكْتَمَلَ تَحَدِّي الذِّكْرِ بِنَجَاحٍ!</h1></div><div class="stars">'+[0,1,2].map(i=>'<span class="'+(i<stars?"on":"")+'">★</span>').join("")+'</div><div class="stats"><div class="stat"><span>🏅 النِّقَاطُ</span><b>'+state.scores.reduce((a,b)=>a+b,0)+'</b></div><div class="stat"><span>✅ الْإِتْقَانُ</span><b>'+c+' / '+QUESTIONS.length+'</b></div><div class="stat"><span>📊 النِّسْبَةُ</span><b>'+pct+'%</b></div><div class="stat"><span>👑 أَفْضَلُ تَتَابُعٍ</span><b>×'+state.best+'</b></div></div><details class="review"><summary>✨ مُرَاجَعَةُ أَسْئِلَةِ '+esc(GAME.lesson)+'</summary><div class="review-grid">'+review+'</div></details><div class="actions"><button class="secondary" data-act="setup">تَغْيِيرُ الْإِعْدَادَاتِ</button><button class="primary" data-act="restart">الْعَبْ مِنْ جَدِيدٍ ✨</button></div><p class="author">إِعْدَادُ: '+esc(GAME.author)+'</p></section></main>'}
function adminHTML(){const rows=QUESTIONS.map((q,i)=>'<article class="edit-row"><h3>السُّؤَالُ '+(i+1)+'</h3><button class="danger" data-act="delete-q" data-index="'+i+'">حَذْفٌ</button><label>نَصُّ الْعَجَلَةِ<input data-q="label" data-index="'+i+'" value="'+esc(q.label)+'"></label><label>نَوْعُ السُّؤَالِ<select data-q="type" data-index="'+i+'">'+["mcq","definition","image","classify","multi","complete","tf"].map(t=>'<option value="'+t+'" '+(q.type===t?"selected":"")+'>'+typeName(t)+'</option>').join("")+'</select></label><label class="wide">نَصُّ السُّؤَالِ<textarea data-q="prompt" data-index="'+i+'">'+esc(q.prompt)+'</textarea></label><label class="wide">الْخِيَارَاتُ — افْصِلْ بَيْنَهَا بِعَلَامَةِ |<textarea data-q="optionsText" data-index="'+i+'">'+esc(q.options.join(" | "))+'</textarea></label><label>رَقْمُ الْإِجَابَةِ الصَّحِيحَةِ<input type="number" min="1" max="4" data-q="answerHuman" data-index="'+i+'" value="'+(q.answer+1)+'"></label><label>الصُّورَةُ التَّعْبِيرِيَّةُ بِالرُّمُوزِ<input data-q="visual" data-index="'+i+'" value="'+esc(q.visual||"")+'"></label><label class="wide">التَّلْمِيحُ<textarea data-q="hint" data-index="'+i+'">'+esc(q.hint||"")+'</textarea></label></article>').join("");return '<main class="shell admin"><section class="admin-card"><div class="admin-head"><h1>⚙️ لَوْحَةُ التَّحَكُّمِ الْكَامِلَةُ</h1><button class="secondary" data-act="setup">مُعَايَنَةُ اللُّعْبَةِ</button></div><div class="admin-grid"><label>عُنْوَانُ اللُّعْبَةِ<input data-game="title" value="'+esc(GAME.title)+'"></label><label>اسْمُ الدَّرْسِ<input data-game="lesson" value="'+esc(GAME.lesson)+'"></label><label>اسْمُ الْمَدْرَسَةِ<input data-game="school" value="'+esc(GAME.school)+'"></label><label>الْإِعْدَادُ<input data-game="author" value="'+esc(GAME.author)+'"></label></div><div class="question-editor">'+rows+'</div><div class="admin-actions"><button class="secondary" data-act="add-q">＋ إِضَافَةُ سُؤَالٍ</button><button class="secondary" data-act="export-jso function mountBranding(){if(state.screen==="setup"){const brand=app.querySelector(".brand");if(brand){const img=document.createElement("img");img.className="moe-logo";img.src=MOE_LOGO;img.alt="شعار وزارة التربية والتعليم والتعليم العالي";brand.prepend(img)}const row=app.querySelector(".switch-row");if(row){const test=document.createElement("button");test.className="switch-btn voice-test";test.dataset.act="test-voice";test.innerHTML="🎙️ تَجْرِبَةُ صَوْتِ التَّحَدِّي";row.appendChild(test);const note=document.createElement("p");note.className="voice-note";note.textContent="اضْغَطْ لِلتَّأَكُّدِ مِنْ سَمَاعِ الصَّوْتِ قَبْلَ بَدْءِ اللَّعِبْ.";row.after(note)}}else if(state.screen==="game"){const brand=app.querySelector(".mini-brand");if(brand){const img=document.createElement("img");img.className="mini-moe-logo";img.src=MOE_LOGO;img.alt="شعار الوزارة";brand.prepend(img)}}else if(state.screen==="results"){const card=app.querySelector(".results .card");if(card){const img=document.createElement("img");img.className="moe-logo";img.src=MOE_LOGO;img.alt="شعار الوزارة";card.prepend(img)}}}
function render(){app.innerHTML=state.screen==="setup"?setupHTML():state.screen==="game"?gameHTML():state.screen==="results"?resultsHTML():adminHTML();mountBranding()}
function start(){primeSpeech();clearInterval(state.timerId);Object.assign(state,{screen:"game",phase:"ready",scores:[0,0],active:0,used:[],current:null,options:[],rotation:0,attempts:0,feedback:null,history:[],streak:0,best:0,time:LEVELS[state.level].seconds,selected:null,pop:null});render()}
function spin(){if(state.phase!=="ready")return;const rem=QUESTIONS.map((_,i)=>i).filter(i=>!state.used.includes(i));if(!rem.length)return finish();clickSound();const picked=rem[Math.floor(Math.random()*rem.length)],slice=360/QUESTIONS.length,norm=((state.rotation%360)+360)%360,desired=(360-picked*slice)%360,target=state.rotation+5*360+(desired-norm+360)%360;state.phase="spinning";render();requestAnimationFrame(()=>requestAnimationFrame(()=>{const w=document.getElementById("wheel");if(w)w.style.transform="rotate("+target+"deg)"}));setTimeout(()=>{state.rotation=target;state.current=picked;state.phase="question";state.time=LEVELS[state.level].seconds;render();startTimer();say(QUESTIONS[picked].prompt)},3200)}
function startTimer(){clearInterval(state.timerId);if(!state.timer)return;state.timerId=setInterval(()=>{if(state.phase!=="question"||state.feedback)return;state.time--;const n=document.getElementById("timeNum");if(n)n.textContent=state.time;if(state.time<=5&&state.time>0)tone(430,.05,"sine",.025);if(state.time<=0)lock(false,true)},1000)}
function showPop(text,good){state.pop={text,good};render();say(text);setTimeout(()=>{state.pop=null;render()},1600)}
function answer(i){if(state.phase!=="question"||state.feedback)return;state.selected=i;const q=QUESTIONS[state.current];if(i===q.answer){lock(true,false);return}state.attempts++;if(state.attempts<LEVELS[state.level].attempts){const msg=motivating[Math.floor(Math.random()*motivating.length)];state.feedback={type:"retry",msg};wrongSound();showPop(msg,false);setTimeout(()=>{if(state.feedback?.type==="retry"){state.feedback=null;state.selected=null;render()}},1700)}else lock(false,false)}
function lock(correct,timeout){if(state.phase!=="question")return;clearInterval(state.timerId);state.history.push({q:state.current,correct,team:state.active});if(correct){state.streak++;state.best=Math.max(state.best,state.streak);state.scores[state.active]+=100+(state.timer?state.time*2:20)+(state.streak>=3?25:0);const msg=encouraging[Math.floor(Math.random()*encouraging.length)];state.feedback={type:"correct",msg};correctSound();confetti();showPop(msg,true)}else{state.streak=0;const msg=timeout?"انْتَهَى الْوَقْتُ، لَا بَأْسَ، رَاجِعْ مَعْلُومَاتِ الذِّكْرِ وَحَاوِلْ مِنْ جَدِيدٍ.":motivating[Math.floor(Math.random()*motivating.length)];state.feedback={type:timeout?"timeout":"wrong",msg};wrongSound();showPop(msg,false)}}
function next(){state.used.push(state.current);state.current=null;state.feedback=null;state.selected=null;state.attempts=0;state.pop=null;if(state.mode==="teams")state.active=state.active?0:1;if(state.used.length>=QUESTIONS.length)finish();else{state.phase="ready";render()}}
function finish(){clearInterval(state.timerId);state.screen="results";fanfare();render();confetti(true);say("أَحْسَنْتُمْ، اكْتَمَلَ تَحَدِّي الذِّكْرِ بِنَجَاحٍ.")}
function download(name,data,type){const a=document.createElement("a"),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function exportPlay(){const clone=document.documentElement.cloneNode(true),data=JSON.parse(JSON.stringify({playOnly:true,game:GAME,questions:QUESTIONS}));clone.querySelector("#game-data").textContent="window.GAME_DATA="+JSON.stringify(data).replace(/</g,"\\u003c")+";";download("تحدي الذكر - نسخة الطلاب.html","<!doctype html>\n"+clone.outerHTML,"text/html;charset=utf-8")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;if(a==="mode"){state.mode=b.dataset.val;render()}else if(a==="level"){state.level=b.dataset.val;state.time=LEVELS[state.level].seconds;render()}else if(a==="timer"){state.timer=!state.timer;render()}else if(a==="sound"){state.sound=!state.sound;if(state.sound)primeSpeech();else try{speechSynthesis.cancel()}catch(e){}render()}else if(a==="test-voice"){state.sound=true;primeSpeech();say("مَرْحَبًا بِكُمْ فِي تَحَدِّي الذِّكْرِ. اسْتَعِدُّوا لِمُرَاجَعَةِ أَنْوَاعِ الذِّكْرِ وَآدَابِهِ وَفَوَائِدِهِ.")}else if(a==="start"||a==="restart")start();else if(a==="spin")spin();else if(a==="answer")answer(+b.dataset.index);else if(a==="next")next();else if(a==="hint"){const q=QUESTIONS[state.current];say(q.hint);alert(q.hint)}else if(a==="speak")say(QUESTIONS[state.current].prompt);else if(a==="setup"){clearInterval(state.timerId);state.screen="setup";render()}else if(a==="fullscreen"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}else if(a==="admin"){state.screen="admin";render()}else if(a==="add-q"){QUESTIONS.push({label:"سُؤَالٌ جَدِيدٌ",type:"mcq",prompt:"اُكْتُبْ نَصَّ السُّؤَالْ.",options:["الْخِيَارُ الْأَوَّلُ","الْخِيَارُ الثَّانِي","الْخِيَارُ الثَّالِثُ","الْخِيَارُ الرَّابِعُ"],answer:0,hint:"تَلْمِيحٌ مُنَاسِبْ.",visual:"📖"});render()}else if(a==="delete-q"){if(QUESTIONS.length<=2)return alert("يَجِبُ بَقَاءُ سُؤَالَيْنِ عَلَى الْأَقَلّْ.");QUESTIONS.splice(+b.dataset.index,1);render()}else if(a==="export-json")download("بيانات تحدي الذكر.json",JSON.stringify({game:GAME,questions:QUESTIONS},null,2),"application/json;charset=utf-8");else if(a==="export-play")exportPlay()});
document.addEventListener("input",e=>{const inp=e.target.dataset.input;if(inp==="solo")state.solo=e.target.value;if(inp==="team0")state.teams[0]=e.target.value;if(inp==="team1")state.teams[1]=e.target.value;const g=e.target.dataset.game;if(g)GAME[g]=e.target.value;const f=e.target.dataset.q,i=+e.target.dataset.index;if(f&&QUESTIONS[i]){if(f==="optionsText")QUESTIONS[i].options=e.target.value.split("|").map(x=>x.trim()).filter(Boolean);else if(f==="answerHuman")QUESTIONS[i].answer=Math.max(0,Math.min(3,+e.target.value-1));else QUESTIONS[i][f]=e.target.value}});
document.addEventListener("change",e=>{if(e.target.id!=="jsonImport"||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.game||!Array.isArray(d.questions)||d.questions.length<2)throw 0;Object.assign(GAME,d.game);QUESTIONS=d.questions;render();alert("تَمَّ اسْتِيرَادُ الْبَيَانَاتِ بِنَجَاحْ.")}catch(_){alert("مِلَفُّ الْبَيَانَاتِ غَيْرُ صَحِيحْ.")}};r.readAsText(e.target.files[0])});
document.addEventListener("keydown",e=>{if((e.code==="Space"||e.code==="Enter")&&state.screen==="game"&&state.phase==="ready"){e.preventDefault();spin()}if(state.screen==="game"&&state.phase==="question"&&["1","2","3","4"].includes(e.key))answer(+e.key-1)});
try{localStorage.clear();if("caches" in window)caches.keys().then(ns=>Promise.all(ns.map(n=>caches.delete(n))))}catch(e){}window.addEventListener("beforeunload",()=>{try{localStorage.clear()}catch(e){}});if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}render();
})();
</script>
</body></html>
